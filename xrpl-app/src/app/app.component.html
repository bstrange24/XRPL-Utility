<div class="min-h-screen w-full bg-gray-50 flex flex-col overflow-hidden">
     <!-- XRPL STATUS BAR -->
     <div class="bg-slate-900 border-b border-slate-800">
          <app-xrpl-status-bar></app-xrpl-status-bar>
     </div>

     <!-- NAVBAR (unchanged) -->
     <header class="w-full bg-white border-b shadow-sm z-50">
          <app-navbar></app-navbar>
     </header>

     <!-- MAIN GRID - Updated Layout -->
     <main class="flex-1 grid grid-cols-1 lg:grid-cols-24 gap-6 p-4 lg:p-6 min-h-0 overflow-hidden">
          <!-- WALLET PANEL - Same width as before -->
          <aside class="lg:col-span-5 xl:col-span-5 min-h-0 overflow-hidden">
               <app-wallet-panel (walletSelected)="selectWallet($event)"></app-wallet-panel>
          </aside>

          <!-- MAIN CONTENT - Made wider -->
          <section class="min-h-0 overflow-hidden bg-white rounded-2xl shadow-sm flex flex-col" [style.grid-column]="isBalanceChangesPage() ? 'span 19 / span 19' : 'span 14 / span 14'">
               <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
                    <div class="flex-1 min-h-0 overflow-auto pl-3 pr-3 lg:p-4" style="padding-top: 0; padding-bottom: 0">
                         <router-outlet></router-outlet>
                    </div>
               </div>
          </section>

          <!-- RIGHT PANEL (Summary + Info) -->
          @if (!isBalanceChangesPage()) {
          <aside class="hidden lg:block lg:col-span-5 xl:col-span-5 min-h-0">
               <div class="h-full flex flex-col gap-4 overflow-hidden">
                    <!-- 1. SUMMARY (Top) -->
                    @if (rightPanelService.summaryComponent(); as summaryComp) {
                    <div class="flex-none bg-white rounded-2xl shadow-sm overflow-hidden">
                         <ng-container *ngComponentOutlet="summaryComp; inputs: rightPanelService.summaryInputs()" />
                    </div>
                    }

                    <!-- 2. MAIN INFO PANEL -->
                    <!-- @if (rightPanelService.component(); as comp) {
                    <div class="flex-1 bg-white rounded-2xl shadow-sm overflow-hidden min-h-0">
                         <ng-container *ngComponentOutlet="comp; inputs: rightPanelService.inputs()" />
                    </div>
                    } @else -->
                    @if (!rightPanelService.summaryComponent()) {
                    <!-- Only show placeholder if there's nothing at all -->
                    <div class="flex-1 bg-white rounded-2xl shadow-sm p-6 text-sm text-gray-400 flex items-center justify-center">No info available</div>
                    }
               </div>
          </aside>
          }
     </main>

     <!-- Toast Container -->
     <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-3 pointer-events-none">
          @for (toast of toastService.toasts(); track toast.id) {
          <div [@toastAnimation] class="group pointer-events-auto bg-white rounded-2xl shadow-xl border overflow-hidden w-fit min-w-[320px] max-w-[600px] hover:scale-[1.02] transition-transform" [class.border-green-500]="toast.type === 'success'" [class.border-red-500]="toast.type === 'error'" [class.border-blue-500]="toast.type === 'info'" [class.border-amber-500]="toast.type === 'warn'" (mouseenter)="toastService.pauseTimer(toast.id)" (mouseleave)="toastService.resumeTimer(toast.id)">
               <!-- Progress Bar -->
               <div class="h-0.5 bg-gray-100 relative overflow-hidden">
                    <div class="absolute left-0 top-0 h-full transition-all duration-100" [class.bg-green-500]="toast.type === 'success'" [class.bg-red-500]="toast.type === 'error'" [class.bg-blue-500]="toast.type === 'info'" [class.bg-amber-500]="toast.type === 'warn'" [style.width.%]="toast.progress"></div>
               </div>

               <div class="flex items-start gap-4 pl-5 pr-4 py-4">
                    <!-- Icon -->
                    <div class="mt-0.5 flex-shrink-0">
                         <ng-icon
                              [name]="toast.type === 'success' ? 'heroCheckCircle' : 
                         toast.type === 'error' ? 'heroXCircle' : 
                         toast.type === 'warn' ? 'heroExclamationTriangle' : 'heroInformationCircle'"
                              size="22"
                              [class.text-green-500]="toast.type === 'success'"
                              [class.text-red-500]="toast.type === 'error'"
                              [class.text-amber-500]="toast.type === 'warn'"
                              [class.text-blue-500]="toast.type === 'info'"
                         >
                         </ng-icon>
                    </div>

                    <div class="flex-1 min-w-0 pt-0.5">
                         <div class="text-sm text-gray-800 leading-relaxed break-words" [innerHTML]="toast.message"></div>
                    </div>

                    <!-- Close Button -->
                    <button (click)="toastService.removeToast(toast.id); $event.stopPropagation()" class="mt-0.5 text-gray-400 hover:text-gray-500 transition-colors">
                         <lucide-icon name="x" size="18"></lucide-icon>
                    </button>
               </div>
          </div>
          }
     </div>
</div>
