<div class="min-h-screen w-full bg-gray-50 flex flex-col overflow-hidden">
     <!-- NAVBAR (full width, fixed height) -->
     <header class="w-full bg-white border-b shadow-sm z-50">
          <app-navbar></app-navbar>
     </header>

     <!-- MAIN GRID - Changed from 12 to 24 columns -->
     <main class="flex-1 grid grid-cols-1 lg:grid-cols-24 gap-6 p-4 lg:p-6 min-h-0 overflow-hidden">
          <!-- WALLET COLUMN - was col-span-3 (25% width), now col-span-5 (~20.8% width - your sweet spot!) -->
          <aside class="lg:col-span-4 xl:col-span-5 min-h-0 overflow-hidden w-full min-w-0">
               <app-wallet-panel (walletSelected)="selectWallet($event)"></app-wallet-panel>
          </aside>

          <!-- MAIN CONTENT - was col-span-6 (50% width), now col-span-12 (still 50% width) -->
          <section class="lg:col-span-12 xl:col-span-12 min-h-0 overflow-hidden bg-white rounded-2xl shadow-sm flex flex-col">
               <div class="flex-1 overflow-y-auto p-3 lg:p-4">
                    <router-outlet></router-outlet>
               </div>
          </section>

          <!-- RIGHT PANEL - was col-span-3 (25% width), now col-span-7 (~29.2% width) -->
          <aside class="hidden lg:block lg:col-span-7 xl:col-span-7 min-h-0 w-full min-w-0">
               <div class="h-full bg-white rounded-2xl shadow-sm overflow-hidden">
                    @if (rightPanelService.component(); as comp) {
                    <ng-container *ngComponentOutlet="comp; inputs: rightPanelService.inputs()" />
                    } @else {
                    <div class="p-6 text-sm text-gray-400">No info available</div>
                    }
               </div>
          </aside>
     </main>

     <!-- TOASTS -->
     <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col-reverse items-center space-y-3 space-y-reverse">
          @for (toast of toastService.toasts(); track toast.id) {
          <div class="group relative flex items-start gap-3 w-96 bg-white rounded-xl shadow-lg border overflow-hidden cursor-pointer transform transition-all duration-300 hover:scale-105 animate-slide-up" [class.border-green-500]="toast.type === 'success'" [class.border-red-500]="toast.type === 'error'" [class.border-blue-500]="toast.type === 'info'" (click)="toastService.removeToast(toast.id)">
               <!-- Colored accent bar -->
               <div class="absolute top-0 left-0 w-1 h-full" [class.bg-green-500]="toast.type === 'success'" [class.bg-red-500]="toast.type === 'error'" [class.bg-blue-500]="toast.type === 'info'"></div>

               <!-- Content -->
               <div class="flex-1 pl-4 pr-3 py-3">
                    <div class="text-sm text-gray-800 break-all" [innerHTML]="toast.message"></div>
               </div>

               <!-- Close indicator -->
               <div class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <div class="text-gray-400 hover:text-gray-600">
                         <lucide-icon name="x" size="14"></lucide-icon>
                    </div>
               </div>
          </div>
          }
     </div>
</div>
