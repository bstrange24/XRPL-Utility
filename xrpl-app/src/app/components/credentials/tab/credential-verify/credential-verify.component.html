<div class="form-group">
     <label for="selectCredential">Select Credential</label>
     <p class="form-hint">Select an existing credential attached to the current wallet.</p>
     <app-select-search-dropdown [items]="creds().dropdown" [value]="view().selectedCredentialItem" (valueChange)="selectCredential.emit({ item: $event, source: 'dropdown' })" placeholder="Search by type or ID..." emptyMessage="No credentials found"> </app-select-search-dropdown>
</div>

@if (credentialViewModel.selectedCredentialIsExpired()) {
<div class="warning-message expired-warning">
     <ng-icon name="heroExclamationTriangle" size="18" class="text-red-600"></ng-icon>
     This selected credential has expired.
</div>
}

<div class="form-row">
     <div class="form-group">
          <label for="credentialType">Credential Type</label>
          <p class="form-hint">A hex-encoded value to identify the type of credential from the issuer.</p>
          <input type="text" [value]="credentialStore.credentialType()" readonly name="credentialType" placeholder="Select a credential above" />
     </div>
</div>

<div class="form-group">
     <label for="credentialId">Credential ID</label>
     <p class="form-hint">Ledger hash containing the credential.</p>
     <input type="text" [value]="credentialStore.credentialID()" readonly name="credentialID" placeholder="Select a credential above" />
</div>

<div class="button-row">
     <button type="button" [class]="view().actionButtonClass" (click)="performAction.emit()" [disabled]="!canSubmit()">{{ view().actionButtonLabel }}</button>
     <button type="button" class="btn-secondary-clear-fields" [disabled]="!canSubmit()" (click)="clearFields.emit()">Clear Fields</button>
</div>
