<div class="space-y-6">
     <!-- Credential Selector -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5">
          <label class="block text-sm font-semibold text-gray-700 mb-2"> Select Credential </label>
          <p class="text-sm text-gray-600 mb-3">Select an existing credential attached to the current wallet.</p>

          <app-select-search-dropdown [items]="creds().dropdown" [value]="view().selectedCredentialItem" (valueChange)="selectCredential.emit({ item: $event, source: 'dropdown' })" placeholder="Search by type or ID..." emptyMessage="No credentials found"> </app-select-search-dropdown>
     </div>

     <!-- Expired Warning -->
     @if (credentialViewModel.selectedCredentialIsExpired()) {
     <div class="rounded-2xl border border-red-200 bg-red-50 p-4 flex items-start gap-3">
          <ng-icon name="heroExclamationTriangle" size="20" class="text-red-600 flex-shrink-0 mt-0.5" />
          <p class="text-sm text-red-700">This selected credential has expired.</p>
     </div>
     }

     <!-- Credential Details -->
     @if (credentialStore.credentialID()) {
     <div class="rounded-2xl border border-gray-200 bg-white p-5 space-y-5">
          <!-- Credential Type -->
          <div>
               <label class="block text-sm font-semibold text-gray-700 mb-2"> Credential Type </label>
               <p class="text-sm text-gray-600 mb-3">Type identifier defined by the issuer</p>
               <input type="text" [value]="credentialStore.credentialType()" readonly class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm font-mono text-gray-600 cursor-not-allowed" />
          </div>

          <!-- Credential ID -->
          <div>
               <label class="block text-sm font-semibold text-gray-700 mb-2"> Credential ID </label>
               <p class="text-sm text-gray-600 mb-3">Ledger hash of the credential</p>
               <input type="text" [value]="credentialStore.credentialID()" readonly class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm font-mono text-gray-600 cursor-not-allowed" />
          </div>
     </div>
     }
</div>
