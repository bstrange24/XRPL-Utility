<div class="space-y-6">
     <!-- Credential Selector Card -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5 hover:shadow-card transition-shadow">
          <label for="selectCredential" class="mb-2 block text-sm font-semibold text-gray-900">Select Credential</label>
          <p class="mb-3 text-sm text-gray-600">Select an existing credential attached to the current wallet.</p>

          <app-select-search-dropdown [items]="creds().dropdown" [value]="view().selectedCredentialItem" (valueChange)="selectCredential.emit({ item: $event, source: 'dropdown' })" placeholder="Search by type or ID..." emptyMessage="No credentials found"> </app-select-search-dropdown>
     </div>

     <!-- Credential Details (Only shown when a credential is selected) -->
     @if (credentialStore.credentialID()) {
     <div class="rounded-2xl border border-gray-200 bg-white p-5 hover:shadow-card transition-shadow">
          <div class="space-y-5">
               <!-- Credential Type -->
               <div>
                    <label for="credentialType" class="mb-2 block text-sm font-semibold text-gray-900">Credential Type</label>
                    <p class="mb-3 text-sm text-gray-600">Type identifier defined by the issuer</p>
                    <input type="text" [value]="credentialStore.credentialType()" readonly class="w-full cursor-not-allowed rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 font-mono text-sm text-gray-700" />
               </div>

               <!-- Credential ID -->
               <div>
                    <label for="credentialID" class="mb-2 block text-sm font-semibold text-gray-900">Credential ID</label>
                    <p class="mb-3 text-sm text-gray-600">Ledger hash of the credential</p>
                    <input type="text" [value]="credentialStore.credentialID()" readonly class="w-full cursor-not-allowed rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 font-mono text-sm text-gray-700" />
               </div>
          </div>
     </div>
     }

     <!-- Expired Warning (More Prominent) -->
     @if (credentialViewModel.selectedCredentialIsExpired()) {
     <div class="my-5 flex gap-3 rounded-xl border border-red-200 bg-red-50 p-3">
          <ng-icon name="heroExclamationTriangle" size="18" class="mt-0.5 flex-shrink-0 text-red-600" />
          <div class="text-sm text-red-700">This selected credential has expired.</div>
     </div>
     }
</div>
