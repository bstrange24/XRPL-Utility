<div class="rounded-2xl border border-gray-200 bg-white p-5 hover:shadow-card transition-shadow">
     <!-- Credential Selector -->
     <div>
          <label for="selectCredential" class="mb-2 block text-sm font-semibold text-gray-900"> Select Credential </label>
          <p class="mb-3 text-sm text-gray-600">Select an existing credential attached to the current wallet.</p>
          <app-select-search-dropdown [items]="creds().dropdown" [value]="view().selectedCredentialItem" (valueChange)="selectCredential.emit({ item: $event, source: 'dropdown' })" placeholder="Search by type or ID..." emptyMessage="No credentials found"> </app-select-search-dropdown>
     </div>

     <!-- Credential ID Display -->
     @if (credentialStore.credentialID()) {
     <div class="my-5">
          <label for="credentialID" class="mb-2 block text-sm font-semibold text-gray-900"> Credential ID </label>
          <p class="mb-3 text-sm text-gray-600">Ledger hash of the selected credential.</p>
          <input type="text" [value]="credentialStore.credentialID()" readonly class="w-full cursor-not-allowed rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 font-mono text-sm text-gray-600" />
     </div>
     }

     <!-- Expired Warning -->
     @if (credentialViewModel.selectedCredentialIsExpired()) {
     <div class="my-5 flex gap-3 rounded-xl border border-red-200 bg-red-50 p-3">
          <ng-icon name="heroExclamationTriangle" size="18" class="mt-0.5 flex-shrink-0 text-red-600" />
          <div class="text-sm text-red-700">This selected credential has expired and cannot be accepted.</div>
     </div>
     }
</div>
