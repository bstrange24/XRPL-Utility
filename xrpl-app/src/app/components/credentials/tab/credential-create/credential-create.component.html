<div class="space-y-6">
     <!-- Credential Details Card -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5 hover:shadow-card transition-shadow">
          <h4 class="mb-5 font-semibold text-gray-900">Credential Details</h4>

          <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
               <!-- Subject -->
               <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-900">Subject</label>
                    <p class="mb-3 text-sm text-gray-600">The address that will receive this credential.</p>
                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="handleSearchQueryChange($event)" (valueChange)="handleDestinationChange($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
               </div>

               <!-- Credential Type -->
               <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-900">Credential Type</label>
                    <p class="mb-3 text-sm text-gray-600">Unique identifier for this credential type (e.g. KYC-2025, MEMBER-LEVEL2)</p>
                    <input type="text" [value]="credentialStore.credentialType()" (input)="credentialUtilService.setCredentialType($event.target.value)" class="w-full rounded-2xl border border-gray-200 px-4 py-3 font-mono text-sm focus:border-green-500 focus:outline-none" placeholder="Enter a credential type (e.g. KYC-Level2)" />
               </div>
          </div>
     </div>

     <!-- Optional Fields Toggle (Borderless - Correct!) -->
     <div class="flex items-center justify-between rounded-xl bg-gray-50 p-4">
          <label class="flex cursor-pointer items-center gap-3">
               <div class="relative inline-flex items-center">
                    <input type="checkbox" class="peer sr-only" [checked]="txUiService.wantsOptions()" (change)="txUiService.toggleOptions($event.target.checked)" />
                    <div class="h-6 w-11 rounded-full bg-gray-200 shadow-inner transition-all duration-300 peer-checked:bg-gradient-to-r peer-checked:from-green-500 peer-checked:to-green-600"></div>
                    <div class="absolute left-0.5 h-5 w-5 transform rounded-full bg-white shadow-md transition-all duration-300 peer-checked:translate-x-5"></div>
               </div>
               <span class="select-none text-sm font-medium text-gray-900 transition-colors"> Include optional fields (URI and Expiration Date) </span>
          </label>

          <!-- Optional: Add a help icon -->
          <button type="button" class="text-gray-400 hover:text-gray-600" title="URI data and expiration date are optional XRPL credential fields">
               <ng-icon name="heroQuestionMarkCircle" size="16"></ng-icon>
          </button>
     </div>

     <!-- Optional Fields Section -->
     @if (txUiService.wantsOptions()) {
     <div class="rounded-2xl border border-gray-200 bg-white p-5 hover:shadow-card transition-shadow">
          <app-transaction-options-section [activeTab]="'createCredential'"></app-transaction-options-section>
     </div>
     }
</div>
