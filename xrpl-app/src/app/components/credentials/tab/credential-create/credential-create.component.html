<div class="space-y-6">
     <!-- Subject + Credential Type - Combined Unit -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5">
          <h4 class="font-semibold text-gray-900 mb-5">Credential Details</h4>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
               <!-- Subject -->
               <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2"> Subject </label>
                    <p class="text-sm text-gray-600 mb-3">The address that will receive this credential.</p>
                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="handleSearchQueryChange($event)" (valueChange)="handleDestinationChange($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
               </div>

               <!-- Credential Type -->
               <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2"> Credential Type </label>
                    <p class="text-sm text-gray-600 mb-3">Unique identifier for this credential type (e.g. KYC-2025, MEMBER-LEVEL2)</p>
                    <input type="text" [value]="credentialStore.credentialType()" (input)="credentialUtilService.setCredentialType($event.target.value)" name="credential_type" class="w-full border border-gray-200 focus:border-blue-500 rounded-2xl px-4 py-3 text-sm font-mono" placeholder="Enter a credential type (e.g. KYC-Level2)" />
               </div>
          </div>
     </div>

     <!-- Optional Fields Toggle -->
     <div class="pt-2">
          <label class="flex items-center cursor-pointer group">
               <div class="relative inline-flex items-center">
                    <input type="checkbox" class="sr-only peer" [checked]="txUiService.wantsOptions()" (change)="txUiService.toggleOptions($event.target.checked)" />
                    <div class="w-11 h-6 bg-gray-200 rounded-full peer-checked:bg-gradient-to-r peer-checked:from-green-500 peer-checked:to-green-600 transition-all duration-300 shadow-inner"></div>
                    <div class="absolute left-0.5 w-5 h-5 bg-white rounded-full transition-all duration-300 transform shadow-md peer-checked:translate-x-5"></div>
               </div>
               <span class="ml-3 text-sm font-medium text-gray-900 select-none transition-colors">Include optional fields (URI and Expiration Date)</span>
          </label>
     </div>

     <!-- Optional Fields Section -->
     @if (txUiService.wantsOptions()) {
     <app-transaction-options-section [activeTab]="'createCredential'"></app-transaction-options-section>
     }
</div>
