<div class="space-y-6">
     <!-- Credential Details Card -->
     <div class="card-base">
          <h4 class="section-heading">
               <lucide-icon name="scroll-text" class="section-heading-icon-tan"></lucide-icon>
               Credential Details
          </h4>

          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <!-- Subject -->
               <div>
                    <label for="credentialSubject" class="label-primary">Subject</label>
                    <p class="text-secondary">The address that will receive this credential.</p>
                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="handleSearchQueryChange($event)" (valueChange)="handleDestinationChange($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
               </div>

               <!-- Credential Type -->
               <div>
                    <label for="credentialType" class="label-primary">Credential Type</label>
                    <p class="text-secondary">Unique identifier for this credential type (e.g. KYC-2025, MEMBER-LEVEL2)</p>
                    <input type="text" class="input-base" [value]="credentialStore.credentialType()" (input)="credentialUtilService.setCredentialType($event.target.value)" placeholder="Enter a credential type (e.g. KYC-Level2)" />
               </div>
          </div>
     </div>

     <!-- Toggle optional fields Card -->
     <div class="card-base">
          <div class="flex items-center justify-between">
               <app-toggle-slider [checked]="txUiService.wantsOptions()" (checkedChange)="txUiService.toggleOptions($event)"> Include optional fields in transaction </app-toggle-slider>

               <div class="flex items-center gap-2">
                    <button type="button" class="btn-optional-fields" title="URI data and expiration date are optional XRPL transaction fields">
                         <ng-icon name="heroQuestionMarkCircle" size="18"></ng-icon>
                    </button>
               </div>
          </div>
     </div>

     <!-- Optional Fields Section -->
     @if (txUiService.wantsOptions()) {
     <div class="card-base">
          <app-transaction-options-section [activeTab]="'createCredential'"></app-transaction-options-section>
     </div>
     }
</div>
