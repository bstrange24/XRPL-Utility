<!-- Get view -->
@let view = sendXrpViewModelService;
<!-- Get active tab -->
@let tab = view.activeTab();

<div class="p-1">
     <div>
          <!-- Menu / Tabs -->
          <app-tab-menu-with-info [tabs]="[]" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)"> </app-tab-menu-with-info>

          <!-- Warning Message -->
          @if (txUiService.warningMessage) {
          <app-warning-message [warningMessage]="safeWarningMessage()"></app-warning-message>
          }

          <!-- Form -->
          <form #theForm="ngForm">
               <app-send-xrp-form
                    [view]="view"
                    [info]="view.infoData()"
                    [destinationItems]="destinationItems()"
                    [currentAddress]="currentAddress()"
                    [lastIntendedDestination]="lastIntendedDestination()"
                    [selectedDestinationAddress]="selectedDestinationAddress()"
                    [selectedDestinationItem]="selectedDestinationItem()"
                    [destinationSearchQuery]="destinationSearchQuery()"
                    [wantsOptions]="txUiService.wantsOptions()"
                    [canSubmit]="canSubmit()"
                    [tab]="tab"
                    (performAction)="performAction()"
                    (clearFields)="clearInputFields()"
                    (searchQueryChange)="handleSearchQueryChange($event)"
                    (destinationChange)="handleDestinationChange($event)"
                    (toggleOptions)="txUiService.toggleOptions($event)"
                    (canSendXrpChange)="handleCanSendXrpChange($event)"
               >
               </app-send-xrp-form>

               <!-- Options -->
               <app-transaction-options [showWhenTab]="['sendXrp']" [activeTab]="view.activeTab" [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()" [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"> </app-transaction-options>

               <div class="main-button-section">
                    <!-- LEFT: primary action -->
                    <!-- <button type="button" (click)="performAction()" [disabled]="!isIdle() || !hasWallets() || !canSendXrpFrom()" class="btn-green">{{ sendXrpUtilService.sendButtonLabel() }}</button> -->
                    <app-button-tooltip [tooltipText]="!canSendXrpFrom() ? 'Cannot send XRP at this time. Check for missing or invalid fields.' : !isIdle() ? 'Wallet is busy. Please wait.' : !hasWallets() ? 'No wallets available.' : ''">
                         <button type="button" class="btn-green" (click)="canSendXrpFrom() && isIdle() && hasWallets() ? performAction() : null" [disabled]="false" [class.opacity-50]="!canSendXrpFrom() || !isIdle() || !hasWallets()" [attr.aria-disabled]="!canSendXrpFrom() || !isIdle() || !hasWallets()">{{ sendXrpUtilService.sendButtonLabel() }}</button>
                    </app-button-tooltip>

                    <!-- RIGHT: secondary / utility actions -->
                    <div class="right-buttons">
                         <button type="button" (click)="clearInputFields()" [disabled]="!isIdle() || !hasWallets()" class="btn-secondary">Clear All Fields</button>
                    </div>
               </div>

               <!-- Execution Time -->
               <div class="execution-time">
                    <app-execution-time-display [time]="executionTime()"></app-execution-time-display>
               </div>

               <!-- Transaction Preview -->
               <div class="pt-2">
                    <app-transaction-preview></app-transaction-preview>
               </div>
          </form>
     </div>
</div>
