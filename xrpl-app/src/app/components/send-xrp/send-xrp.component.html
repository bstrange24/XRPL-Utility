@let view = sendXrpViewModelService; @let tab = view.activeTab();

<div class="p-2">
     <div class="card space-y-6">
          <!-- Tabs -->
          <app-tab-menu-with-info [tabs]="[]" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)"> </app-tab-menu-with-info>

          <!-- Summary -->
          <app-send-xrp-summary [info]="view.infoData()" [tab]="'sendXrp'" [summaryMessage]="''" [infoPanelExpanded]="false"> </app-send-xrp-summary>

          <!-- Warning -->
          @if (txUiService.warningMessage) {
          <app-warning-message [warningMessage]="safeWarningMessage()"> </app-warning-message>
          }

          <!-- Form -->
          <form #theForm="ngForm" class="space-y-6">
               <app-send-xrp-form
                    [view]="view"
                    [info]="view.infoData()"
                    [destinationItems]="destinationItems()"
                    [selectedDestinationItem]="selectedDestinationItem()"
                    [destinationSearchQuery]="destinationSearchQuery()"
                    [wantsOptions]="txUiService.wantsOptions()"
                    [canSubmit]="canSubmit()"
                    [tab]="tab"
                    (performAction)="performAction()"
                    (clearFields)="clearInputFields()"
                    (searchQueryChange)="handleSearchQueryChange($event)"
                    (destinationChange)="handleDestinationChange($event)"
                    (toggleOptions)="txUiService.toggleOptions($event)"
               >
               </app-send-xrp-form>

               <!-- Buttons -->
                <!-- COMMAND BAR -->
<div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between gap-3">

     <!-- LEFT: secondary / utility actions -->
     <div class="flex items-center gap-2">
          
          <button
               type="button"
               (click)="clearInputFields()"
               [disabled]="!isIdle() || !hasWallets()"
               class="btn-secondary"
          >
               Clear Fields
          </button>

          <!-- Future-safe slot (preview, simulate, etc.) -->
          <button
               type="button"
               class="btn-ghost"
               disabled
          >
               Preview
          </button>

     </div>

     <!-- RIGHT: primary action -->
     <div class="flex items-center gap-2">

          <!-- Optional status hint (future spinner hook) -->
          <span class="hidden sm:inline text-xs text-gray-400">
               {{ isIdle() ? 'Ready' : 'Processing...' }}
          </span>

          <button
               type="button"
               (click)="performAction()"
               [disabled]="!isIdle() || !hasWallets()"
               class="btn-primary"
          >
               {{ sendXrpUtilService.sendButtonLabel() }}
          </button>

     </div>

</div>
               <!-- <div class="flex flex-col sm:flex-row gap-3 pt-4">
                    <button type="button" (click)="performAction()" [disabled]="!isIdle() || !hasWallets()" class="btn-primary">{{ sendXrpUtilService.sendButtonLabel() }}</button>

                    <button type="button" (click)="clearInputFields()" [disabled]="!isIdle() || !hasWallets()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium px-5 py-2.5 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed">Clear Fields</button>
               </div> -->

               <!-- Options -->
               <app-transaction-options [showWhenTab]="['sendXrp']" [activeTab]="view.activeTab" [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()" [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"> </app-transaction-options>

               <!-- Execution Time -->
               <div class="text-sm text-gray-500">
                    <app-execution-time-display [time]="executionTime()"></app-execution-time-display>
               </div>

               <!-- Preview -->
               <div class="pt-4 border-t">
                    <app-transaction-preview></app-transaction-preview>
               </div>
          </form>
     </div>
</div>
