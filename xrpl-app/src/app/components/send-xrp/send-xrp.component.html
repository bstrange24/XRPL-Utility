<!-- Get view -->
@let view = sendXrpViewModelService;
<!-- Get active tab -->
@let tab = view.activeTab();

<div class="p-1">
     <div>
          <!-- Menu / Tabs -->
          <!-- <app-tab-menu-with-info [tabs]="[]" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)"> </app-tab-menu-with-info> -->
          <app-tab-menu-with-info [tabs]="sendXrpTabs" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)"> </app-tab-menu-with-info>

          <!-- Info Message -->
          <app-send-xrp-summary [info]="view.infoData()" [tab]="'sendXrp'" [summaryMessage]="''" [infoPanelExpanded]="false"> </app-send-xrp-summary>

          <!-- Warning Message -->
          @if (txUiService.warningMessage) {
          <app-warning-message [warningMessage]="safeWarningMessage()"> </app-warning-message>
          }

          <!-- Form -->
          <form #theForm="ngForm">
               <app-send-xrp-form
                    [view]="view"
                    [info]="view.infoData()"
                    [destinationItems]="destinationItems()"
                    [selectedDestinationItem]="selectedDestinationItem()"
                    [destinationSearchQuery]="destinationSearchQuery()"
                    [wantsOptions]="txUiService.wantsOptions()"
                    [canSubmit]="canSubmit()"
                    [tab]="tab"
                    (performAction)="performAction()"
                    (clearFields)="clearInputFields()"
                    (searchQueryChange)="handleSearchQueryChange($event)"
                    (destinationChange)="handleDestinationChange($event)"
                    (toggleOptions)="txUiService.toggleOptions($event)"
               >
               </app-send-xrp-form>

               <!-- Options -->
               <app-transaction-options [showWhenTab]="['sendXrp']" [activeTab]="view.activeTab" [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()" [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"> </app-transaction-options>

               <div class="mt-0 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <!-- LEFT: primary action -->
                    <button type="button" (click)="performAction()" [disabled]="!isIdle() || !hasWallets()" class="btn-primary whitespace-nowrap">{{ sendXrpUtilService.sendButtonLabel() }}</button>

                    <!-- RIGHT: secondary / utility actions -->
                    <div class="flex flex-wrap items-center justify-end gap-2">
                         <button type="button" (click)="clearInputFields()" [disabled]="!isIdle() || !hasWallets()" class="btn-secondary whitespace-nowrap">Clear Fields</button>
                    </div>
               </div>

               <!-- Execution Time -->
               <div class="text-sm text-gray-500 mt-3">
                    <app-execution-time-display [time]="executionTime()"></app-execution-time-display>
               </div>

               <!-- Transaction Preview -->
               <div class="pt-2">
                    <app-transaction-preview></app-transaction-preview>
               </div>
          </form>
     </div>
</div>
