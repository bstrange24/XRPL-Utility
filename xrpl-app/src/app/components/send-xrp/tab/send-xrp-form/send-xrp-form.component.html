<div class="space-y-6">
     <!-- Send XRP Details Card -->
     <div class="card-base">
          <h4 class="section-heading">
               <ng-icon name="heroPaperAirplane" class="section-heading-icon-green"></ng-icon>
               Payment Details
          </h4>

          <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
               <!-- Destination -->
               <div>
                    <label for="destination" class="label-primary">Destination</label>
                    <p class="text-secondary">The unique address receiving the XRP payment.</p>
                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="searchQueryChange.emit($event)" (valueChange)="destinationChange.emit($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
               </div>

               <!-- XRP Amount -->
               <div>
                    <label for="xrpAmount" class="label-primary">XRP Amount</label>
                    <p class="text-secondary">Amount in XRP (precision up to 0.000001).</p>
                    <input type="number" class="input-base" [ngModel]="accountConfiguratorStoreService.amount()" (ngModelChange)="utilsService.updateAmount($event)" placeholder="e.g. 10.5" step="0.000001" min="0" />
               </div>
          </div>
     </div>

     <!-- Toggle optional fields Card -->
     <div class="card-base">
          <div class="flex items-center justify-between">
               <app-toggle-slider [checked]="txUiService.wantsOptions()" (checkedChange)="txUiService.toggleOptions($event)"> Include optional fields in transaction </app-toggle-slider>

               <div class="flex items-center gap-2">
                    <button type="button" class="btn-optional-fields" title="Destination Tag, Source Tag, Invoice ID, Domain ID and Credential IDs are optional XRPL transaction fields">
                         <ng-icon name="heroQuestionMarkCircle" size="18"></ng-icon>
                    </button>
               </div>
          </div>
     </div>

     <!-- Optional Fields Section -->
     @if (wantsOptions()) {
     <div class="card-base">
          <app-transaction-options-section [activeTab]="'sendXrp'"></app-transaction-options-section>
     </div>
     }
</div>
