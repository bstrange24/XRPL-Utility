<div class="form-row">
     <!-- Destination -->
     <div class="form-group">
          <label for="destination">Destination</label>
          <p class="form-hint">The unique address of the account receiving the XRP payment. Select destination from the dropdown or manually enter a new destination.</p>
          <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="searchQueryChange.emit($event)" (valueChange)="destinationChange.emit($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
     </div>
     <div class="form-group">
          <label for="amountField">XRP Amount</label>
          <p class="form-hint">Amount, in XRP, to send to the destination. Use arrows for ±0.000001 precision.</p>
          <input type="number" name="amountField" placeholder="e.g. 10.5" step="0.000001" min="0" [ngModel]="accountConfiguratorStoreService.amount()" (ngModelChange)="utilsService.updateAmount($event)" (focus)="onFocus($event)" class="amount-input" />
     </div>
</div>

<div class="switch-group">
     <mat-slide-toggle class="mini-toggle" [checked]="txUiService.wantsOptions()" (change)="toggleOptions.emit($event.checked)">Include optional fields (Destination Tag, Source Tag)</mat-slide-toggle>
</div>

<!-- Optional fields section -->
@if (wantsOptions()) {
<app-transaction-options-section [activeTab]="'sendXrp'"></app-transaction-options-section>
}
