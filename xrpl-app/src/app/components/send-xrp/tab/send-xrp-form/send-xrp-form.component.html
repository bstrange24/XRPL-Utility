<div class="space-y-6">
     <div class="rounded-2xl border border-gray-200 bg-white p-5 transition-shadow hover:shadow-card">
          <h4 class="mb-5 font-semibold text-gray-900">Payment Details</h4>
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <!-- Destination -->
               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">Destination</label>
                    <p class="text-xs text-gray-500">The unique address receiving the XRP payment.</p>
                    <div class="h-[54px]">
                         <app-select-search-dropdown class="h-full w-full" [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="searchQueryChange.emit($event)" (valueChange)="destinationChange.emit($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
                    </div>
               </div>

               <!-- XRP Amount -->
               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">XRP Amount</label>
                    <p class="text-xs text-gray-500">Amount in XRP (precision up to 0.000001).</p>
                    <input type="number" class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm focus:border-green-500 focus:outline-none" placeholder="e.g. 10.5" step="0.000001" min="0" [ngModel]="accountConfiguratorStoreService.amount()" (ngModelChange)="utilsService.updateAmount($event)" />
               </div>
          </div>
     </div>

     <!-- Optional Fields Toggle (Now with container) -->
     <div class="rounded-xl border border-gray-200 bg-gray-50 p-4 transition-shadow hover:shadow-sm">
          <label class="flex cursor-pointer items-center gap-3">
               <div class="relative inline-flex items-center">
                    <input type="checkbox" class="peer sr-only" [checked]="txUiService.wantsOptions()" (change)="toggleOptions.emit($event.target.checked)" />
                    <div class="h-6 w-11 rounded-full bg-gray-200 shadow-inner transition-all duration-300 peer-checked:bg-gradient-to-r peer-checked:from-green-500 peer-checked:to-green-600"></div>
                    <div class="absolute left-0.5 h-5 w-5 transform rounded-full bg-white shadow-md transition-all duration-300 peer-checked:translate-x-5"></div>
               </div>
               <span class="select-none text-sm font-medium text-gray-900 transition-colors"> Include optional fields (Destination Tag, Source Tag) </span>
          </label>
     </div>

     <!-- Optional Fields Section -->
     @if (wantsOptions()) {
     <div class="rounded-2xl border border-gray-200 bg-white p-5 transition-shadow hover:shadow-card">
          <app-transaction-options-section [activeTab]="'sendXrp'"></app-transaction-options-section>
     </div>
     }
</div>
