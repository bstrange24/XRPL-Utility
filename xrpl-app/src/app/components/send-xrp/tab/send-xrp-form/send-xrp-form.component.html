<!-- Destination + Amount Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 border border-gray-200 rounded-2xl p-5 bg-white">
     <!-- Destination -->
     <div class="space-y-2">
          <!-- <label class="text-sm font-medium">
               <input type="text" />
               Destination
          </label> -->
          <div class="text-sm font-medium">Destination</div>
          <!-- <label type="text" class="text-sm font-medium">Destination</label> -->
          <p class="text-xs text-gray-500">The unique address receiving the XRP payment.</p>
          <div class="h-[54px]">
               <app-select-search-dropdown class="w-full h-full" [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="searchQueryChange.emit($event)" (valueChange)="destinationChange.emit($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
          </div>
     </div>

     <!-- XRP Amount -->
     <div class="space-y-2">
          <!-- <label class="text-sm font-medium">
               <input type="text" />
               XRP Amount
          </label> -->
          <!-- <label type="text" class="text-sm font-medium">XRP Amount</label> -->
          <div class="text-sm font-medium">XRP Amount</div>
          <p class="text-xs text-gray-500">Amount in XRP (precision up to 0.000001).</p>
          <input type="number" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" placeholder="e.g. 10.5" step="0.000001" min="0" [ngModel]="accountConfiguratorStoreService.amount()" (ngModelChange)="utilsService.updateAmount($event)" />
     </div>
</div>

<!-- Toggle Optional Fields -->
<div class="flex flex-col gap-3 mt-2">
     <label class="flex items-center cursor-pointer group">
          <div class="relative inline-flex items-center">
               <input type="checkbox" class="sr-only peer" [checked]="txUiService.wantsOptions()" (change)="toggleOptions.emit($event.target.checked)" />
               <div class="w-11 h-6 bg-gray-200 rounded-full peer-checked:bg-gradient-to-r peer-checked:from-green-500 peer-checked:to-green-600 transition-all duration-300 shadow-inner"></div>
               <div class="absolute left-0.5 w-5 h-5 bg-white rounded-full transition-all duration-300 transform shadow-md peer-checked:translate-x-5"></div>
          </div>
          <span class="ml-3 text-sm font-medium text-gray-900 select-none transition-colors">Include optional fields</span>
     </label>

     <!-- Optional Fields Section -->
     @if (wantsOptions()) {
     <app-transaction-options-section [activeTab]="'sendXrp'"></app-transaction-options-section>
     }
</div>
