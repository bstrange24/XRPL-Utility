@if (info()) {
<div class="space-y-6 p-3">
     <div class="w-full flex items-center justify-between bg-white border border-gray-200 rounded-2xl px-5 py-4 active:bg-gray-100 transition-all">
          <div class="flex items-center gap-3">
               <ng-icon name="heroInformationCircle" size="22" class="text-blue-600" />

               <div class="flex-1 min-w-0 text-left">
                    <span [innerHTML]="info()" class="text-gray-600"></span>
               </div>
          </div>
     </div>
</div>
}
