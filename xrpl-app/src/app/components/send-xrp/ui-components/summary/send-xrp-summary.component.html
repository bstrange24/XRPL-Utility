@if (info()) {
<div class="bg-green-50 border border-gray-200 rounded-2xl p-2 flex gap-4 mb-4">
     <ng-icon name="heroInformationCircle" size="22" class="text-green-600 mt-0.5 flex-shrink-0" />

     <div class="text-sm leading-relaxed text-green-800 flex-1">
          <div [innerHTML]="info()"></div>
     </div>
</div>
}
