<!-- Get active tab -->
@let tab = delegateTransactionViewModelService.activeTab();

<div class="p-1">
     <app-tab-menu-with-info [tabs]="menuTabs" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)" />

     @if (txUiService.warningMessage) {
     <app-warning-message [warningMessage]="safeWarningMessage()"></app-warning-message>
     }

     <form #theForm="ngForm">
          @if (tab === 'delegateCreate') {
          <app-delegate-create
               [destinationItems]="destinationItems()"
               [selectedDestinationItem]="selectedDestinationItem()"
               [destinationSearchQuery]="destinationSearchQuery()"
               (searchQueryChange)="destinationSearchQuery.set($event)"
               [actions]="delegateStore.actions()"
               [selectedActions]="delegateStore.selected()"
               (destinationChange)="setDelegateDestination($event)"
               (actionToggle)="toggleSelection($event)"
          />
          } @else if (tab === 'delegateClear') {
          <app-delegate-clear
               [delegations]="delegateStore.existingDelegations()"
               [selectedDestination]="delegateStore.destination()"
               [actions]="delegateStore.actions()"
               [selectedActions]="delegateStore.selected()"
               (actionToggle)="toggleSelection($event)"
               (destinationChange)="setDelegateDestination($event)"
          />
          }

          <app-delegate-requirement-info class="block mt-4" />

          <app-transaction-options
               [showWhenTab]="['delegateCreate', 'delegateClear']"
               [activeTab]="delegateTransactionViewModelService.activeTab"
               [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()"
               [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"
          />

          <div class="main-button-section">
               <app-button-tooltip [tooltipText]="getButtonTooltip()">
                    @if (tab === 'delegateCreate') {
                    <button
                         type="button"
                         class="btn-primary"
                         [class.opacity-50]="!canPerformAction()"
                         [attr.aria-disabled]="!canPerformAction()"
                         [attr.tabindex]="!canPerformAction() ? 0 : null"
                         (click)="canPerformAction() ? performAction() : null"
                         [disabled]="false"
                    >
                         Grant Permissions
                    </button>
                    } @else {
                    <button
                         type="button"
                         class="btn-red"
                         [class.opacity-50]="!canPerformAction()"
                         [attr.aria-disabled]="!canPerformAction()"
                         [attr.tabindex]="!canPerformAction() ? 0 : null"
                         (click)="canPerformAction() ? performAction() : null"
                         [disabled]="false"
                    >
                         Remove Delegate
                    </button>
                    }
               </app-button-tooltip>

               <div class="right-buttons">
                    <button type="button" class="btn-secondary" (click)="clearFields()" [disabled]="!isIdle() || !hasWallets()">Clear Fields</button>
               </div>
          </div>

          <div class="execution-time">
               <app-execution-time-display [time]="executionTime()"></app-execution-time-display>
          </div>

          <div class="pt-2">
               <app-transaction-preview></app-transaction-preview>
          </div>
     </form>
</div>
