<section class="card-base">
     <h3 class="section-heading">
          <span class="section-heading-icon-red" aria-hidden="true">−</span>
          Remove a delegate
     </h3>
     <p class="text-secondary">Select an active delegate to remove all permissions and release its owner reserve.</p>

     @if (delegations().length) {
     <div class="delegation-list">
          @for (delegation of delegations(); track delegation.index) {
          <label class="delegation-card" [class.delegation-card-selected]="!!selectedDestination() && selectedDestination() === delegation.Authorize">
               <input
                    type="radio"
                    name="delegate-to-clear"
                    [value]="delegation.Authorize"
                    [checked]="!!selectedDestination() && selectedDestination() === delegation.Authorize"
                    (change)="destinationChange.emit(delegation.Authorize || '')"
               />
               <span class="delegation-card-copy">
                    <span class="delegation-address">{{ delegation.Authorize }}</span>
                    <span class="delegation-permissions">{{ delegation.Permissions.length }} permission{{ delegation.Permissions.length === 1 ? '' : 's' }}</span>
                    <span class="delegation-values">
                         @for (permission of delegation.Permissions; track permission.Permission.PermissionValue) {
                         <span class="permission-chip">{{ permission.Permission.PermissionValue }}</span>
                         }
                    </span>
               </span>
          </label>
          }
     </div>
     } @else {
     <div class="empty-delegations" role="status">
          <strong>No active delegations</strong>
          <span>This account does not currently have any delegates to remove.</span>
     </div>
     }
</section>
