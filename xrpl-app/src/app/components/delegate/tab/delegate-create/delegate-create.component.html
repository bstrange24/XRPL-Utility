<div class="space-y-6">
     <section class="card-base">
          <h3 class="section-heading">
               <lucide-icon name="plus" class="section-heading-icon-green"></lucide-icon>
               Grant permissions
          </h3>
          <div class="delegate-field">
               <label class="label-primary" for="delegate-authorize">Delegate account <span class="text-red-500">*</span></label>
               <p class="text-secondary">Choose the XRPL account that may perform the selected actions.</p>
               <app-select-search-dropdown
                    id="delegate-authorize"
                    [items]="destinationItems()"
                    app-focus-border
                    [validateXrpAddress]="true"
                    [showClearButton]="true"
                    [clearOnEscape]="true"
                    [validateOn]="'blur'"
                    [closeWhenInvalid]="true"
                    [value]="selectedDestinationItem()"
                    [searchQueryInput]="destinationSearchQuery()"
                    (searchQueryChange)="searchQueryChange.emit($event)"
                    (valueChange)="destinationChange.emit($event?.id || '')"
                    placeholder="Search or enter an account address..."
                    emptyMessage="No accounts found"
               />
          </div>
     </section>

     <section class="card-base">
          <div class="delegate-permissions-heading">
               <div>
                    <h3 class="section-heading">Permissions <span class="text-red-500">*</span></h3>
                    <p class="text-secondary">Select up to 10 actions to grant. The delegate cannot perform other actions for this account.</p>
               </div>
               <span class="permission-count">{{ selectedActions().size }} / 10 selected</span>
          </div>

          <div class="permission-grid">
               @for (action of actions(); track action.id) {
               <label class="permission-card" [class.permission-card-selected]="selectedActions().has(action.id)" [class.permission-card-disabled]="!selectedActions().has(action.id) && selectedActions().size >= 10">
                    <input type="checkbox" [checked]="selectedActions().has(action.id)" [disabled]="!selectedActions().has(action.id) && selectedActions().size >= 10" (change)="actionToggle.emit(action.id)" class="hidden" />
                    <span class="mt-0.5 flex h-5 w-5 flex-shrink-0 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="selectedActions().has(action.id)" [class.border-gray-300]="!selectedActions().has(action.id)" [class.bg-green-500]="selectedActions().has(action.id)">
                         @if (selectedActions().has(action.id)) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </span>
                    <span class="permission-card-copy">
                         <span class="permission-name">{{ action.key }}</span>
                         <span class="permission-type">{{ action.txType }}</span>
                         <span class="permission-description">{{ action.description }}</span>
                    </span>
               </label>
               }
          </div>
     </section>
</div>
