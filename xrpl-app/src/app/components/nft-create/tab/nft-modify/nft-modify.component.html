<div class="form-group">
     <label>Select NFT</label>
     <p class="form-hint">Select an existing NFT to update.</p>
     <app-select-search-dropdown [items]="nftUtilService.nftItems()" [value]="nftUtilService.selectedNftItem()" (valueChange)="onNftSelected($event)" placeholder="Search by ID or URI..." emptyMessage="No NFTs found"> </app-select-search-dropdown>
</div>

<div class="form-row" style="margin-top: 0.8em">
     <div class="form-group">
          <label>Nft Token Id</label>
          <p class="form-hint">NFT Token ID generated when the NFT was created.</p>
          <input type="text" [(ngModel)]="nftCreateStoreService.nftId" name="nftIdField" placeholder="" />
     </div>
</div>

<div class="form-row">
     <div class="form-group">
          <label>URI</label>
          <p class="form-hint">URI that points to the data and/or metadata associated with the NFT. The URI is NOT checked for validity, but the field is limited to a maximum length of 256 bytes.</p>
          <input type="text" [(ngModel)]="nftCreateStoreService.initialURI" name="initialURI" placeholder="" />
     </div>
</div>
<div class="form-row">
     <div class="form-group">
          <label>Owner</label>
          <p class="form-hint">The NFT owner that created the NFT.</p>
          <input type="text" [(ngModel)]="nftCreateStoreService.nftOwnerAddress" name="nftOwnerAddress" placeholder="" />
     </div>
</div>
