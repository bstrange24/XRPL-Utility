<div class="space-y-8">
     <!-- Select NFT -->
     <div class="space-y-2">
          <label class="text-sm font-medium">Select NFT</label>
          <p class="text-xs text-gray-500">Select an existing NFT to update its metadata.</p>

          <div class="h-[54px]">
               <app-select-search-dropdown [items]="nftUtilService.nftItems()" [value]="nftUtilService.selectedNftItem()" (valueChange)="onNftSelected($event)" placeholder="Search by ID or URI..." emptyMessage="No NFTs found" />
          </div>
     </div>

     <!-- NFT Token ID -->
     <div class="space-y-2" style="margin-top: 0">
          <label class="text-sm font-medium">NFT Token ID</label>
          <p class="text-xs text-gray-500">NFT Token ID generated when the NFT was created.</p>

          <input type="text" [(ngModel)]="nftCreateStoreService.nftId" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" />
     </div>

     <!-- New URI -->
     <div class="space-y-2" style="margin-top: 0">
          <label class="text-sm font-medium">New URI</label>
          <p class="text-xs text-gray-500">URI that points to the updated data/metadata. Max 256 bytes (hex-encoded).</p>

          <input type="text" [(ngModel)]="nftCreateStoreService.initialURI" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" />
     </div>

     <!-- Owner -->
     <div class="space-y-2" style="margin-top: 0">
          <label class="text-sm font-medium">Owner</label>
          <p class="text-xs text-gray-500">The current owner of the NFT (must match the account submitting the update if required by flags).</p>

          <input type="text" [(ngModel)]="nftCreateStoreService.nftOwnerAddress" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" />
     </div>
</div>
