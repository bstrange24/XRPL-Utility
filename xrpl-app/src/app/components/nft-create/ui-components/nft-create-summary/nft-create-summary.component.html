@if (nftTransactionViewModelService.infoData(); as info) {
<app-summary-container [walletName]="info?.walletName || ''" [summaryText]="summaryText()" [itemCount]="info?.nftCount || 0" [links]="info?.links || null" [buttonLabel]="'NFTs'" [emptyStateMessage]="emptyStateMessage()" [infoPanelExpanded]="infoPanelExpanded()" (toggleInfoPanel)="toggleInfoPanel.emit()">
     <!-- Items List -->
     <div items-list>
          @for (nft of info?.nftsToShow || []; track nft.id) {
          <app-summary-item [selected]="nft.id === nftUtilService.selectedNftItem()" [copyValue]="nft.id" copyTooltip="Copy NFT ID" (onClick)="onNftClick(nft)" (onCopyClick)="copyUtilService.copyAndToast($event, 'NFT ID')">
               <div item-content>
                    <!-- NFT Content -->
                    <div class="flex items-start gap-3">
                         <ng-icon name="heroCog" size="20" class="text-gray-400 mt-0.5 flex-shrink-0" />
                         <div class="flex-1 min-w-0">
                              <div class="flex items-center gap-2 flex-wrap">
                                   <app-tooltip-link [href]="explorerUrl() + 'nft/' + nft.id" tooltipText="View NFT on XRPL Explorer">
                                        <strong class="text-gray-900 hover:text-blue-600 transition-colors">NFT ID: <span class="font-mono text-sm">{{ nft.id }}</span></strong>
                                   </app-tooltip-link>
                              </div>

                              <!-- Metadata -->
                              <div class="mt-3 text-sm">
                                   <app-summary-key-value label="Taxon">
                                        <span class="font-mono">{{ nft.taxon }}</span>
                                   </app-summary-key-value>
                                   <app-summary-key-value label="Sequence">
                                        <span class="font-mono">{{ nft.sequence }}</span>
                                   </app-summary-key-value>
                                   <app-summary-key-value label="URI">
                                        <span class="font-mono">{{ nft.uri || 'None' }}</span>
                                   </app-summary-key-value>
                                   @if (nft.transferFee) {
                                   <app-summary-key-value label="Transfer Fee">
                                        <span class="font-mono">{{ nft.transferFee / 1000 }}%</span>
                                   </app-summary-key-value>
                                   }
                                   <app-summary-key-value label="Flags">
                                        <span class="font-mono">{{ nft.flags.length ? nft.flags : 'None' }}</span>
                                   </app-summary-key-value>
                              </div>
                         </div>
                    </div>
               </div>
          </app-summary-item>
          }
     </div>
</app-summary-container>
}
