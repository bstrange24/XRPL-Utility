@let vm = view;

<div class="space-y-6">
     <div class="card-base">
          <!-- Headers -->
          <div class="side-by-side-fields">
               <h4 class="section-heading">
                    <lucide-icon name="dollarSign" class="section-heading-icon-green"></lucide-icon>
                    Taker Gets – Buy Side
               </h4>

               <h4 class="section-heading">
                    <lucide-icon name="dollarSign" class="section-heading-icon-green"></lucide-icon>
                    Taker Pays – Sell Side
               </h4>
          </div>

          <!-- Currency Codes -->
          <div class="side-by-side-fields">
               <div class="space-y-2">
                    <div>
                         <div class="field-label">
                              <label for="currencyCode" class="label-primary">Currency Code</label>
                         </div>

                         <div class="flex items-center gap-2">
                              <p class="text-secondary">The token you want to receive.</p>
                              <button type="button" (click)="toggleTakerGetsCurrencyHelper()" class="text-gray-400 hover:text-gray-600 pb-2">
                                   <ng-icon name="heroQuestionMarkCircle" size="14" />
                              </button>
                         </div>

                         <app-select-search-dropdown [items]="vm.weWantCurrencyItems()" [value]="vm.selectedWeWantCurrencyItem()" [showShortAddress]="false" (valueChange)="weWantCurrencySelected.emit($event)" placeholder="Search currency code..." emptyMessage="No currencies available" />
                    </div>
                    <app-field-helper title="Taker Gets Currency" [items]="takerGetsCurrencyHelperItems" [show]="showTakerGetsCurrencyHelper" />
               </div>

               <div class="space-y-2">
                    <div>
                         <div class="field-label">
                              <label for="currencyCodeSpend" class="label-primary">Currency Code</label>
                         </div>

                         <div class="flex items-center gap-2">
                              <p class="text-secondary">The token you want to spend.</p>
                              <button type="button" (click)="toggleTakerPaysCurrencyHelper()" class="text-gray-400 hover:text-gray-600 pb-2">
                                   <ng-icon name="heroQuestionMarkCircle" size="14" />
                              </button>
                         </div>

                         <app-select-search-dropdown [items]="vm.weSpendCurrencyItems()" [value]="vm.selectedWeSpendCurrencyItem()" [showShortAddress]="false" (valueChange)="weSpendCurrencySelected.emit($event)" placeholder="Search currency code..." emptyMessage="No currencies available" />
                    </div>
                    <app-field-helper title="Taker Pays Currency" [items]="takerPaysCurrencyHelperItems" [show]="showTakerPaysCurrencyHelper" />
               </div>
          </div>

          <!-- Issuers -->
          <div class="side-by-side-fields">
               <div class="space-y-2 mt-3">
                    <div>
                         <div class="field-label">
                              <label for="issuer" class="label-primary">Issuer</label>
                         </div>

                         <div class="flex items-center gap-2">
                              <p class="text-secondary">The XRPL account that issues the token you want to receive.</p>
                              <button type="button" (click)="toggleTakerGetsIssuerHelper()" class="text-gray-400 hover:text-gray-600 pb-2">
                                   <ng-icon name="heroQuestionMarkCircle" size="14" />
                              </button>
                         </div>

                         <app-select-search-dropdown [items]="vm.weWantIssuerItems()" [value]="vm.selectedWeWantIssuerItem()" [showShortAddress]="true" (valueChange)="weWantIssuerSelected.emit($event)" placeholder="Search issuer address or name..." emptyMessage="No issuers available for this currency" />
                    </div>
                    <app-field-helper title="Taker Gets Issuer" [items]="takerGetsIssuerHelperItems" [show]="showTakerGetsIssuerHelper" />
               </div>

               <div class="space-y-2 mt-3">
                    <div>
                         <div class="field-label">
                              <label for="issuerSpend" class="label-primary">Issuer</label>
                         </div>

                         <div class="flex items-center gap-2">
                              <p class="text-secondary">The XRPL account that issues the token you want to spend.</p>
                              <button type="button" (click)="toggleTakerPaysCurrencyHelper()" class="text-gray-400 hover:text-gray-600 pb-2">
                                   <ng-icon name="heroQuestionMarkCircle" size="14" />
                              </button>
                         </div>

                         <app-select-search-dropdown [items]="vm.weSpendIssuerItems()" [value]="vm.selectedWeSpendIssuerItem()" [showShortAddress]="true" (valueChange)="weSpendIssuerSelected.emit($event)" placeholder="Search issuer address or name..." emptyMessage="No issuers available for this currency" />
                    </div>
                    <app-field-helper title="Taker Pays Issuer" [items]="takerPaysIssuerHelperItems" [show]="showTakerPaysIssuerHelper" />
               </div>
          </div>
     </div>
</div>
