@let vm = view;

<div class="rounded-2xl border border-gray-200 bg-white p-5 transition-shadow hover:shadow-card">
     <div class="space-y-6">
          <!-- Headers -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <div>
                    <label class="block text-sm font-semibold text-gray-900">Taker Gets – Buy Side</label>
               </div>
               <div>
                    <label class="block text-sm font-semibold text-gray-900">Taker Pays – Sell Side</label>
               </div>
          </div>

          <!-- Currency Codes -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">Currency Code</label>
                    <p class="text-xs text-gray-500">The token you want to receive.</p>

                    <div class="h-[54px]">
                         <app-select-search-dropdown [items]="vm.weWantCurrencyItems()" [value]="vm.selectedWeWantCurrencyItem()" [showShortAddress]="false" (valueChange)="weWantCurrencySelected.emit($event)" placeholder="Search currency code..." emptyMessage="No currencies available" />
                    </div>
               </div>

               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">Currency Code</label>
                    <p class="text-xs text-gray-500">The token you want to spend.</p>

                    <div class="h-[54px]">
                         <app-select-search-dropdown [items]="vm.weSpendCurrencyItems()" [value]="vm.selectedWeSpendCurrencyItem()" [showShortAddress]="false" (valueChange)="weSpendCurrencySelected.emit($event)" placeholder="Search currency code..." emptyMessage="No currencies available" />
                    </div>
               </div>
          </div>

          <!-- Issuers -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">Issuer</label>
                    <p class="text-xs text-gray-500">The XRPL account that issues the token you want to receive.</p>

                    <div class="h-[54px]">
                         <app-select-search-dropdown [items]="vm.weWantIssuerItems()" [value]="vm.selectedWeWantIssuerItem()" [showShortAddress]="true" (valueChange)="weWantIssuerSelected.emit($event)" placeholder="Search issuer address or name..." emptyMessage="No issuers available for this currency" />
                    </div>
               </div>

               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">Issuer</label>
                    <p class="text-xs text-gray-500">The XRPL account that issues the token you want to spend.</p>

                    <div class="h-[54px]">
                         <app-select-search-dropdown [items]="vm.weSpendIssuerItems()" [value]="vm.selectedWeSpendIssuerItem()" [showShortAddress]="true" (valueChange)="weSpendIssuerSelected.emit($event)" placeholder="Search issuer address or name..." emptyMessage="No issuers available for this currency" />
                    </div>
               </div>
          </div>
     </div>
</div>
