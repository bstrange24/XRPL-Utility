@if (offerStoreService.existingOffers().length > 0) {
<div class="rounded-2xl border border-gray-200 bg-white p-5 transition-shadow hover:shadow-card">
     <div class="space-y-4">
          <!-- Select Offers to Cancel -->
          <div class="space-y-2">
               <label class="block text-sm font-semibold text-gray-900">Select Offers to Cancel</label>
               <p class="text-xs text-gray-500">Select existing offers to cancel for the selected account.</p>

               <!-- Multi-Select Combobox -->
               <div class="relative">
                    <div class="relative">
                         <input
                              #offerDropdownInput
                              type="text"
                              [value]="offerSearchQuery()"
                              (input)="onOfferSearchInput($event)"
                              (focus)="openOfferDropdown()"
                              (keydown)="onOfferKeyDown($event)"
                              [placeholder]="selectedOfferSequences().length > 0 ? 
                                                  selectedOfferSequences().length + ' offer(s) selected' : 
                                                  'Search offers by sequence...'"
                              class="w-full rounded-2xl border border-gray-200 px-4 py-3 pr-10 text-sm focus:border-green-500 focus:outline-none"
                              autocomplete="off"
                         />

                         <button type="button" (click)="toggleOfferDropdown()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                              <lucide-icon name="chevron-down" size="18" />
                         </button>
                    </div>
               </div>
          </div>

          <!-- Selected Offers Chips -->
          @if (selectedOffers().length > 0) {
          <div class="rounded-xl border border-gray-200 bg-gray-50 p-4">
               <div class="mb-3 flex items-center justify-between">
                    <span class="text-sm font-medium text-gray-700">Selected Offers ({{ selectedOffers().length }})</span>
                    <button type="button" (click)="clearAllOfferSelections()" class="text-sm font-medium text-red-600 hover:text-red-700">Clear all</button>
               </div>

               <div class="flex flex-wrap gap-2">
                    @for (offer of selectedOffers(); track offer.Sequence) {
                    <div class="flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-3 py-1.5">
                         <span class="font-mono text-sm text-gray-800">{{ formatOfferDisplay(offer) }}</span>
                         <button type="button" (click)="toggleOfferSelection(offer)" class="text-gray-400 transition-colors hover:text-red-500">
                              <ng-icon name="heroXCircle" size="16" />
                         </button>
                    </div>
                    }
               </div>
          </div>
          }
     </div>
</div>
}
