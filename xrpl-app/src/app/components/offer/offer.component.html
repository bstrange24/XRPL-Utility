<div class="banner">
     <div class="banner-content">
          <div id="navbar-container">
               <app-navbar></app-navbar>
          </div>
     </div>
</div>

@let viewModel = offerTransactionViewModelService;
@let tab = viewModel.activeTab();
@let tabs = menuTabs;

<div class="main-container">
     <div class="content-wrapper">
          <app-wallet-panel (walletSelected)="selectWallet($event)"></app-wallet-panel>

          <div class="form-panel">
               <app-tab-menu-with-info [tabs]="tabs" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)"></app-tab-menu-with-info>

               <app-offer-summary [infoPanelExpanded]="infoPanelExpanded()" (toggleInfoPanel)="toggleInfoPanel()"></app-offer-summary>

               @if (txUiService.warningMessage) {
               <app-warning-message [warningMessage]="safeWarningMessage()"></app-warning-message>
               }

               <form #theForm="ngForm" class="main-form">
                    <div class="tab-content-columns">
                         <div class="tab-content-container form-fields-container">
                              <app-offer-fields
                                   [tab]="tab"
                                   (weWantCurrencySelected)="onWeWantCurrencySelected($event)"
                                   (weWantIssuerSelected)="onWeWantIssuerSelected($event)"
                                   (weSpendCurrencySelected)="onWeSpendCurrencySelected($event)"
                                   (weSpendIssuerSelected)="onWeSpendIssuerSelected($event)"
                                   (weWantAmountChange)="handleWeWantAmountChange()"
                                   (weSpendAmountChange)="handleWeSpendAmountChange()"
                                   (invertOrder)="invertOrder()"
                              />
                         </div>
                    </div>

                    <app-transaction-options
                         [showWhenTab]="['createOffer', 'cancelOffer']"
                         [activeTab]="viewModel.activeTab"
                         [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()"
                         [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"
                    />

                    <div class="button-row">
                         <button type="button" [class]="offerUtilsService.actionButtonClass()" (click)="performAction()" [disabled]="!isIdle() || !hasWallets()">
                              {{ txUiService.spinner() ? 'Processing...' : offerUtilsService.actionButtonLabel() }}
                         </button>

                         @if (tab === 'createOffer' || tab === 'getOrderBook') {
                         <button type="button" class="btn-primary-green" (click)="invertOrder()" [disabled]="!isIdle() || !hasWallets()">
                              Invert Order
                         </button>
                         }

                         <button type="button" class="btn-secondary-clear-fields" (click)="clearInputFields()" [disabled]="!isIdle() || !hasWallets()">Clear Fields</button>
                    </div>

                    <app-execution-time-display [time]="executionTime()"></app-execution-time-display>

                    <app-transaction-preview></app-transaction-preview>
               </form>
          </div>

          <app-offer-requirements-info></app-offer-requirements-info>
     </div>
</div>
