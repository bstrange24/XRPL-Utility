<div class="space-y-6">
     <!-- Destination Card (Mandatory) -->
     <div class="card-base">
          <label for="accountDeleteDestination" class="label-primary">Destination</label>
          <p class="text-secondary">The address that will receive the remaining XRP after deletion.</p>

          <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="searchQueryChange.emit($event)" (valueChange)="destinationChange.emit($event)" placeholder="Enter or select destination address"> </app-select-search-dropdown>
     </div>

     <!-- Toggle optional fields Card -->
     <div class="card-base">
          <div class="flex items-center justify-between">
               <app-toggle-slider [checked]="txUiService.wantsOptions()" (checkedChange)="txUiService.toggleOptions($event)"> Include optional fields in transaction </app-toggle-slider>

               <div class="flex items-center gap-2">
                    <button type="button" class="btn-optional-fields" title="Destination Tag and Source Tag are optional XRPL fields">
                         <ng-icon name="heroQuestionMarkCircle" size="18"></ng-icon>
                    </button>
               </div>
          </div>
     </div>

     <!-- Optional Fields Section -->
     @if (wantsOptions()) {
     <div class="card-base">
          <app-transaction-options-section [activeTab]="'deleteAccount'"></app-transaction-options-section>
     </div>
     }

     <!-- Transaction Options (Signing) -->
     <app-transaction-options [activeTab]="view().activeTab" [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()" [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"> </app-transaction-options>

     <!-- Destructive Action Warning (IMPORTANT for Delete Account) -->
     <div class="alert-error">
          <ng-icon name="heroExclamationTriangle" size="18" class="flex-shrink-0 alert-icon" />
          <div class="alert-content">Deleting your account will permanently remove it from the XRP Ledger. Ensure you have a backup of your keys and have transferred any assets.</div>
     </div>

     <!-- Action Buttons -->
     <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <!-- Delete Button (Destructive) -->
          <button type="button" (click)="performAction.emit()" [disabled]="!canSubmit() || view().deleteBlockers().length > 0 || !connectionGuard.isConnectionReady()" class="w-full rounded-2xl bg-gradient-to-r from-red-600 to-red-700 px-8 py-3 text-base font-semibold text-white shadow-md transition-all hover:from-red-700 hover:to-red-800 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed sm:w-auto">{{ view().deleteWalletButtonLabel() }}</button>

          <!-- Clear Fields Button (Secondary) -->
          <button type="button" (click)="clearFields.emit()" [disabled]="!canSubmit() || !connectionGuard.isConnectionReady()" class="rounded-2xl border border-gray-300 bg-white px-6 py-3 text-sm font-medium text-gray-700 transition-all hover:bg-gray-50 hover:text-gray-900 disabled:opacity-50 disabled:cursor-not-allowed">Clear Fields</button>
     </div>
</div>
