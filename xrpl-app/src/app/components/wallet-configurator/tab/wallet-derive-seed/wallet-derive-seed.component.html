@if (walletsViewModelService.activeTab() === 'deriveSeed') {
<div class="card-base">
     <div class="space-y-6">
          <!-- Seed Input -->
          <div class="space-y-2">
               <div class="flex items-center justify-between gap-4">
                    <label for="enterSeed" class="label-primary">Family Seed</label>
               </div>
               <p class="text-secondary">Enter a valid XRPL family seed (starts with <code class="font-mono">s</code>).</p>
          </div>

          <div class="space-y-2">
               <div class="relative">
                    <input #seedInput type="text" class="input-base-with-validation" app-focus-border [isValid]="!isSeedValid()" [isInvalid]="isSeedInvalid()" [ngModel]="walletsStoreService.seed()" (ngModelChange)="onSeedChange($event)" placeholder="e.g. sEd7P3...." autocomplete="off" spellcheck="false" />

                    <!-- Clear Button -->
                    @if (walletsStoreService.seed()) {
                    <button type="button" (click)="clearSeed()" class="absolute right-3 top-1/2 flex h-5 w-5 -translate-y-1/2 items-center justify-center rounded-full text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-700" aria-label="Clear seed">
                         <ng-icon name="heroXMark" size="14"></ng-icon>
                    </button>
                    }
               </div>
          </div>
          <!-- Example -->
          <div class="rounded-2xl border border-gray-100 bg-gray-50 p-4">
               <p class="mb-1 text-xs font-semibold uppercase tracking-wider text-gray-500">Example</p>
               <code class="block break-all font-mono text-sm text-gray-700">sEdTM1uX8pu2do5XvTnutH6HsouMaM2</code>
          </div>

          <!-- Encryption Type -->
          <div class="space-y-3">
               <label for="encryptionType" class="label-primary">Encryption Type</label>

               <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <!-- ED25519 -->
                    <button type="button" class="cursor-pointer rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="walletsStoreService.ed25519_encryption_type()" [class.bg-green-50]="walletsStoreService.ed25519_encryption_type()" [class.border-gray-200]="!walletsStoreService.ed25519_encryption_type()" (click)="walletsUtilService.setEncryption('ed25519')">
                         <div class="flex items-start gap-3">
                              <div class="mt-0.5 flex-shrink-0">
                                   <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="walletsStoreService.ed25519_encryption_type()" [class.border-gray-300]="!walletsStoreService.ed25519_encryption_type()">
                                        <div class="h-2.5 w-2.5 rounded-full bg-green-500 transition-transform duration-200" [class.scale-100]="walletsStoreService.ed25519_encryption_type()" [class.scale-0]="!walletsStoreService.ed25519_encryption_type()"></div>
                                   </div>
                              </div>

                              <div class="flex-1 text-left">
                                   <div class="text-sm font-semibold text-gray-900">ED25519</div>
                                   <p class="mt-1 text-xs text-gray-500">Modern encryption, faster transactions</p>
                              </div>
                         </div>
                    </button>

                    <!-- SECP256K1 -->
                    <button type="button" class="cursor-pointer rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="walletsStoreService.secp256k1_encryption_type()" [class.bg-green-50]="walletsStoreService.secp256k1_encryption_type()" [class.border-gray-200]="!walletsStoreService.secp256k1_encryption_type()" (click)="walletsUtilService.setEncryption('secp256k1')">
                         <div class="flex items-start gap-3">
                              <div class="mt-0.5 flex-shrink-0">
                                   <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="walletsStoreService.secp256k1_encryption_type()" [class.border-gray-300]="!walletsStoreService.secp256k1_encryption_type()">
                                        <div class="h-2.5 w-2.5 rounded-full bg-green-500 transition-transform duration-200" [class.scale-100]="walletsStoreService.secp256k1_encryption_type()" [class.scale-0]="!walletsStoreService.secp256k1_encryption_type()"></div>
                                   </div>
                              </div>

                              <div class="flex-1 text-left">
                                   <div class="text-sm font-semibold text-gray-900">SECP256K1</div>
                                   <p class="mt-1 text-xs text-gray-500">Legacy encryption, widely compatible</p>
                              </div>
                         </div>
                    </button>
               </div>
          </div>

          <!-- Validation Summary -->
          @if (hasValidationErrors()) {
          <div class="alert-error">
               <ng-icon name="heroXCircle" size="18" class="alert-icon flex-shrink-0" />
               <div class="alert-content">{{ validationErrorMessage() }}</div>
          </div>
          }

          <!-- Action Buttons -->
          <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
               <!-- LEFT: primary action -->
               <button type="button" class="btn-blue disabled:cursor-not-allowed disabled:opacity-50" (click)="walletConfiguratorComponent.deriveWalletFromFamilySeed()" [disabled]="walletsStoreService.buttonLoading().deriveWalletFromFamilySeed || walletsUtilService.isAnyButtonLoading || !isSeedValid()">{{ walletsStoreService.buttonLoading().deriveWalletFromFamilySeed ? 'Processing...' : 'Derive Wallet from Family Seed' }}</button>

               <!-- RIGHT: secondary / utility actions -->
               <div class="flex flex-wrap items-center justify-end gap-2">
                    <button type="button" class="btn-secondary" (click)="clearSeed()">Clear Seed</button>
               </div>
          </div>
     </div>
</div>
}
