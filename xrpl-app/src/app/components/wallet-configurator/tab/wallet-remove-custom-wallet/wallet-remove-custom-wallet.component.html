@if (walletsViewModelService.activeTab() === 'removeCustomWallets') {
<div class="form-row">
     <div class="form-group">
          <label for="destination">Custom Wallets</label>
          <app-select-search-dropdown [items]="customOnlyItems()" [value]="selectedCustomItem()" (valueChange)="onCustomWalletSelected($event)" placeholder="Select custom wallet to remove" />
     </div>
</div>

<div style="margin: 10px 0; font-size: 0.9em; color: #555">Selected: <strong>{{ walletsStoreService.selectedAddress() || '' }}</strong></div>
}
