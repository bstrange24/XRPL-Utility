@if (walletsViewModelService.activeTab() === 'removeCustomWallets') {
<div class="form-row">
     <div class="form-group">
          <label for="destination">Custom Wallets</label>
          <!-- Use customOnlyItems instead of destinationItems() -->
          <app-select-search-dropdown [items]="customOnlyItems()" [value]="selectedDestinationItem()" (searchQueryChange)="typedDestination.set($event)" (valueChange)="selectedDestinationAddress.set($event?.id || '')" placeholder="Select custom wallet to remove" />
     </div>
</div>
}
