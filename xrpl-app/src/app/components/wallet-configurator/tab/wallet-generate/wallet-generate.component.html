@if (walletsViewModelService.activeTab() === 'generate') {
<div class="rounded-2xl border border-gray-200 bg-white p-5 transition-shadow hover:shadow-card">
     <div class="space-y-5">
          <!-- Generation Buttons -->
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
               <button type="button" class="btn-primary w-full" (click)="walletConfiguratorComponent.generateNewAccount()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromSeed || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromSeed ? 'Processing...' : 'Generate from Family Seed' }}</button>
               <button type="button" class="btn-primary w-full" (click)="walletConfiguratorComponent.generateNewWalletFromMnemonic()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromMnemonic || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromMnemonic ? 'Processing...' : 'Generate from Mnemonic' }}</button>
               <button type="button" class="btn-primary w-full" (click)="walletConfiguratorComponent.generateNewWalletFromSecretNumbers()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromSecretNumbers || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromSecretNumbers ? 'Processing...' : 'Generate from Secret Numbers' }}</button>
          </div>

          <!-- Encryption Type Toggle -->
          <div class="space-y-3">
               <label for="encryptionType" class="block text-sm font-semibold text-gray-900">Encryption Type</label>

               <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <!-- ED25519 Option -->
                    <button type="button" class="cursor-pointer rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="walletsStoreService.ed25519_encryption_type()" [class.bg-green-50]="walletsStoreService.ed25519_encryption_type()" [class.border-gray-200]="!walletsStoreService.ed25519_encryption_type()" (click)="walletsUtilService.setEncryption('ed25519')">
                         <div class="flex items-start gap-3">
                              <div class="mt-0.5 flex-shrink-0">
                                   <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="walletsStoreService.ed25519_encryption_type()" [class.border-gray-300]="!walletsStoreService.ed25519_encryption_type()">
                                        <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-green-500" [class.scale-100]="walletsStoreService.ed25519_encryption_type()" [class.scale-0]="!walletsStoreService.ed25519_encryption_type()"></div>
                                   </div>
                              </div>

                              <div class="flex-1">
                                   <div class="text-sm font-semibold text-gray-900">ED25519</div>
                                   <p class="mt-1 text-xs text-gray-500">Modern encryption, faster transactions</p>
                              </div>
                         </div>
                    </button>

                    <!-- SECP256K1 Option -->
                    <button type="button" class="cursor-pointer rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="walletsStoreService.secp256k1_encryption_type()" [class.bg-green-50]="walletsStoreService.secp256k1_encryption_type()" [class.border-gray-200]="!walletsStoreService.secp256k1_encryption_type()" (click)="walletsUtilService.setEncryption('secp256k1')">
                         <div class="flex items-start gap-3">
                              <div class="mt-0.5 flex-shrink-0">
                                   <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="walletsStoreService.secp256k1_encryption_type()" [class.border-gray-300]="!walletsStoreService.secp256k1_encryption_type()">
                                        <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-green-500" [class.scale-100]="walletsStoreService.secp256k1_encryption_type()" [class.scale-0]="!walletsStoreService.secp256k1_encryption_type()"></div>
                                   </div>
                              </div>

                              <div class="flex-1">
                                   <div class="text-sm font-semibold text-gray-900">SECP256K1</div>
                                   <p class="mt-1 text-xs text-gray-500">Legacy encryption, widely compatible</p>
                              </div>
                         </div>
                    </button>
               </div>
          </div>

          <!-- Info Box -->
          <div class="flex items-start gap-3 rounded-2xl border border-blue-100 bg-blue-50 p-4">
               <ng-icon name="heroInformationCircle" size="18" class="mt-0.5 flex-shrink-0 text-blue-600" />
               <div class="text-sm text-blue-800"><strong class="font-semibold">Note:</strong> Generating a Mnemonic or Secret Number wallet will always use SECP256K1 encryption.</div>
          </div>
     </div>
</div>
}
