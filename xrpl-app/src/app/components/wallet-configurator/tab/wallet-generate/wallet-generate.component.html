@if (walletsViewModelService.activeTab() === 'generate') {
<div class="card-base">
     <div class="space-y-6">
          <!-- Encryption Type Toggle -->
          <div class="space-y-1">
               <label for="encryptionType" class="label-primary">Encryption Type</label>

               <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <!-- ED25519 Option -->
                    <button type="button" class="cursor-pointer rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="walletsStoreService.ed25519_encryption_type()" [class.bg-green-50]="walletsStoreService.ed25519_encryption_type()" [class.border-gray-200]="!walletsStoreService.ed25519_encryption_type()" (click)="walletsUtilService.setEncryption('ed25519')">
                         <div class="summary-item-content">
                              <div class="mt-0.5 flex-shrink-0">
                                   <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="walletsStoreService.ed25519_encryption_type()" [class.border-gray-300]="!walletsStoreService.ed25519_encryption_type()">
                                        <div class="h-2.5 w-2.5 rounded-full bg-green-500 transition-transform duration-200" [class.scale-100]="walletsStoreService.ed25519_encryption_type()" [class.scale-0]="!walletsStoreService.ed25519_encryption_type()"></div>
                                   </div>
                              </div>

                              <div class="flex-1">
                                   <div class="text-sm font-semibold text-gray-900">ED25519</div>
                                   <p class="mt-1 text-xs text-gray-500">Modern encryption, faster transactions</p>
                              </div>
                         </div>
                    </button>

                    <!-- SECP256K1 Option -->
                    <button type="button" class="cursor-pointer rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="walletsStoreService.secp256k1_encryption_type()" [class.bg-green-50]="walletsStoreService.secp256k1_encryption_type()" [class.border-gray-200]="!walletsStoreService.secp256k1_encryption_type()" (click)="walletsUtilService.setEncryption('secp256k1')">
                         <div class="summary-item-content">
                              <div class="mt-0.5 flex-shrink-0">
                                   <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="walletsStoreService.secp256k1_encryption_type()" [class.border-gray-300]="!walletsStoreService.secp256k1_encryption_type()">
                                        <div class="h-2.5 w-2.5 rounded-full bg-green-500 transition-transform duration-200" [class.scale-100]="walletsStoreService.secp256k1_encryption_type()" [class.scale-0]="!walletsStoreService.secp256k1_encryption_type()"></div>
                                   </div>
                              </div>

                              <div class="flex-1">
                                   <div class="text-sm font-semibold text-gray-900">SECP256K1</div>
                                   <p class="mt-1 text-xs text-gray-500">Legacy encryption, widely compatible</p>
                              </div>
                         </div>
                    </button>
               </div>
          </div>

          <div class="flex items-center gap-3">
               <label class="text-sm font-medium text-gray-700">Generate Mnemonic with:</label>
               <div class="relative">
                    <select [(ngModel)]="walletConfiguratorComponent.selectedWordCount" (change)="walletConfiguratorComponent.onWordCountChange($event)" class="text-sm border border-gray-200 rounded-xl pl-4 pr-8 py-2 bg-white focus:outline-none focus:border-green-500 appearance-none cursor-pointer min-w-[140px]">
                         <option value="12">12 words</option>
                         <option value="15">15 words</option>
                         <option value="18">18 words</option>
                         <option value="21">21 words</option>
                         <option value="24">24 words</option>
                    </select>
                    <ng-icon name="heroChevronDown" size="14" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" />
               </div>
          </div>

          <!-- Info Box -->
          <div class="flex items-center gap-2 rounded-2xl border border-blue-100 bg-blue-50 p-2">
               <ng-icon name="heroInformationCircle" size="18" class="flex-shrink-0 text-blue-600" />
               <div class="text-sm text-blue-800"><strong class="font-semibold">Note:</strong> Generating a Mnemonic or Secret Number wallet will always use SECP256K1 encryption.</div>
          </div>

          <!-- Generation Buttons -->
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
               <button type="button" class="btn-green" (click)="walletConfiguratorComponent.generateNewAccount()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromSeed || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromSeed ? 'Processing...' : 'Generate from Family Seed' }}</button>
               <button type="button" class="btn-green" (click)="walletConfiguratorComponent.generateNewWalletFromMnemonic()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromMnemonic || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromMnemonic ? 'Processing...' : 'Generate from Mnemonic' }}</button>
               <button type="button" class="btn-green" (click)="walletConfiguratorComponent.generateNewWalletFromSecretNumbers()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromSecretNumbers || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromSecretNumbers ? 'Processing...' : 'Generate from Secret Numbers' }}</button>
          </div>
     </div>
</div>
}
