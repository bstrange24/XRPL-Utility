@if (walletsViewModelService.activeTab() === 'generate') {
<div class="space-y-3">
     <button type="button" class="btn-primary w-full" (click)="walletConfiguratorComponent.generateNewAccount()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromSeed || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromSeed ? 'Processing...' : 'Generate Wallet from Family Seed' }}</button>
     <button type="button" class="btn-primary w-full" (click)="walletConfiguratorComponent.generateNewWalletFromMnemonic()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromMnemonic || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromMnemonic ? 'Processing...' : 'Generate Wallet from Mnemonic' }}</button>
     <button type="button" class="btn-primary w-full" (click)="walletConfiguratorComponent.generateNewWalletFromSecretNumbers()" [disabled]="walletsStoreService.buttonLoading().generateNewWalletFromSecretNumbers || walletsUtilService.isAnyButtonLoading">{{ walletsStoreService.buttonLoading().generateNewWalletFromSecretNumbers ? 'Processing...' : 'Generate Wallet from Secret Numbers' }}</button>
</div>

<!-- Encryption Type Toggle - Card Style -->
<div class="grid grid-cols-2 gap-3 mt-4">
     <div class="border rounded-xl p-3 cursor-pointer transition-all" [class.border-green-500]="walletsStoreService.ed25519_encryption_type()" [class.bg-green-50]="walletsStoreService.ed25519_encryption_type()" [class.border-gray-200]="!walletsStoreService.ed25519_encryption_type()" (click)="walletsUtilService.setEncryption('ed25519')">
          <div class="flex items-center gap-2">
               <input type="radio" [checked]="walletsStoreService.ed25519_encryption_type()" name="encryptionType" (change)="walletsUtilService.setEncryption('ed25519')" class="w-4 h-4 text-green-600 focus:ring-green-500" />
               <span class="text-sm font-medium text-gray-700">ED25519</span>
          </div>
          <p class="text-xs text-gray-500 mt-1 ml-6">Modern encryption, faster transactions</p>
     </div>

     <div class="border rounded-xl p-3 cursor-pointer transition-all" [class.border-green-500]="walletsStoreService.secp256k1_encryption_type()" [class.bg-green-50]="walletsStoreService.secp256k1_encryption_type()" [class.border-gray-200]="!walletsStoreService.secp256k1_encryption_type()" (click)="walletsUtilService.setEncryption('secp256k1')">
          <div class="flex items-center gap-2">
               <input type="radio" [checked]="walletsStoreService.secp256k1_encryption_type()" name="encryptionType" (change)="walletsUtilService.setEncryption('secp256k1')" class="w-4 h-4 text-green-600 focus:ring-green-500" />
               <span class="text-sm font-medium text-gray-700">SECP256K1</span>
          </div>
          <p class="text-xs text-gray-500 mt-1 ml-6">Legacy encryption, widely compatible</p>
     </div>
</div>

<!-- Info Box -->
<div class="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-xl">
     <p class="text-sm text-blue-800 pb-0 mb-0" style="margin-bottom: 0"><strong>Note:</strong> Generating a Mnemonic or Secret Number wallet will always be SECP256K1 encryption.</p>
</div>
}
