<!-- Three-column layout matching Send XRP styling -->
<div class="p-1">
     <div>
          <!-- Menu / Tabs -->
          @let tabs = menuTabs;
          <app-tab-menu-with-info [tabs]="tabs" [active]="walletsViewModelService.activeTab()" [metaMap]="tabMeta" (activeChange)="setTab($event)"> </app-tab-menu-with-info>

          <!-- Warning Message -->
          @if (txUiService.warningMessage) {
          <app-warning-message [warningMessage]="safeWarningMessage()"></app-warning-message>
          }

          <!-- Form -->
          <form #theForm="ngForm">
               <!-- Derive Seed -->
               <app-wallet-derive-seed></app-wallet-derive-seed>

               <!-- Derive Mnemonic -->
               <app-wallet-derive-mnemonic></app-wallet-derive-mnemonic>

               <!-- Derive Secret Numbers -->
               <app-wallet-derive-secret-numbers></app-wallet-derive-secret-numbers>

               <!-- Remove custom wallets -->
               <app-wallet-remove-custom-wallet></app-wallet-remove-custom-wallet>

               <!-- Generate buttons -->
               <app-wallet-generate></app-wallet-generate>

               <!-- Execution Time -->
               <div class="text-sm text-gray-500 mt-4">
                    <app-execution-time-display [time]="walletConfiguratorOrchestrator.executionTimeValue()"></app-execution-time-display>
               </div>

               <!-- Transaction Preview -->
               <div class="pt-2">
                    <app-transaction-preview></app-transaction-preview>
               </div>
          </form>
     </div>
</div>
