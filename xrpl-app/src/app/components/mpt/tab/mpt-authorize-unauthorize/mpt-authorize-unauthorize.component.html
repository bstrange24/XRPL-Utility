<!-- Auth section - Radio Buttons -->
<div class="form-row">
     <div class="form-group">
          <label for="mptIssuanceAction">Action</label>
          <div class="radio-group-horizontal" style="margin-top: 0.7em; display: flex; gap: 2.2rem; flex-wrap: wrap">
               <label class="radio-label" style="display: flex; align-items: center; gap: 0.6rem; cursor: pointer">
                    <input type="radio" name="authAction" value="authorize" [checked]="authAction === 'authorize'" (change)="setAuthAction('authorize')" />
                    <ng-icon name="heroCheckCircle" size="22" class="text-green-600"></ng-icon>
                    Authorize
               </label>

               <label class="radio-label" style="display: flex; align-items: center; gap: 0.6rem; cursor: pointer">
                    <input type="radio" name="authAction" value="unauthorize" [checked]="authAction === 'unauthorize'" (change)="setAuthAction('unauthorize')" />
                    <ng-icon name="heroXCircle" size="22" class="text-red-600"></ng-icon>
                    Unauthorize
               </label>
          </div>
     </div>
</div>

<!-- MPT Issuer -->
<div class="form-row">
     <div class="form-group">
          <label for="destination">MPT Issuer</label>
          <p class="form-hint">Account that issued the MPT.</p>
          <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
     </div>
</div>

<!-- MPT Issuance ID -->
<div class="form-row">
     <div class="form-group">
          <label for="lockMptIssuanceId">MPT Issuance ID</label>
          <p class="form-hint">Identifies the MPTokenIssuance.</p>
          <input type="text" [ngModel]="mptIssuanceId" (ngModelChange)="setMptIssuanceId($event)" name="mptIssuanceIdField" placeholder="" />
     </div>
</div>
