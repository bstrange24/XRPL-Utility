     <!-- Auth/Unauth Card -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5 transition-shadow hover:shadow-card">
          <div class="space-y-6">
               <!-- Auth section - Radio Buttons -->
               <h4 class="mb-5 font-semibold text-gray-900">MPT Details</h4>
               <div>
                    <label class="mb-3 block text-sm font-semibold text-gray-900">Action</label>

                    <div class="flex flex-wrap gap-6">
                         <!-- Authorize Radio -->
                         <label class="relative flex cursor-pointer items-center gap-2 group">
                              <input type="radio" name="authAction" value="authorize" [checked]="authAction === 'authorize'" (change)="setAuthAction('authorize')" class="hidden" />

                              <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-amber-500]="authAction === 'authorize'" [class.border-gray-300]="authAction !== 'authorize'">
                                   <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-amber-500" [class.scale-100]="authAction === 'authorize'" [class.scale-0]="authAction !== 'authorize'"></div>
                              </div>

                              <ng-icon name="heroCheckCircle" size="18" class="text-amber-500"></ng-icon>
                              <span class="text-sm font-medium text-gray-900 transition-colors group-hover:text-gray-700">Authorize</span>
                         </label>

                         <!-- Unauthorize Radio -->
                         <label class="relative flex cursor-pointer items-center gap-2 group">
                              <input type="radio" name="authAction" value="unauthorize" [checked]="authAction === 'unauthorize'" (change)="setAuthAction('unauthorize')" class="hidden" />

                              <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-red-500]="authAction === 'unauthorize'" [class.border-gray-300]="authAction !== 'unauthorize'">
                                   <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-red-500" [class.scale-100]="authAction === 'unauthorize'" [class.scale-0]="authAction !== 'unauthorize'"></div>
                              </div>

                              <ng-icon name="heroXCircle" size="18" class="text-red-500"></ng-icon>
                              <span class="text-sm font-medium text-gray-900 transition-colors group-hover:text-gray-700">Unauthorize</span>
                         </label>
                    </div>
               </div>

               <!-- MPT Issuer -->
               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">MPT Issuer</label>
                    <p class="text-xs text-gray-500">Account that issued the MPT.</p>

                    <div class="h-[54px]">
                         <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
                    </div>
               </div>

               <!-- MPT Issuance ID -->
               <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-900">MPT Issuance ID</label>
                    <p class="text-xs text-gray-500">Identifies the MPTokenIssuance.</p>

                    <input type="text" [ngModel]="mptIssuanceId" (ngModelChange)="setMptIssuanceId($event)" name="mptIssuanceIdField" placeholder="Enter MPT Issuance ID" class="w-full rounded-2xl border border-gray-200 px-4 py-3 font-mono text-sm focus:border-green-500 focus:outline-none" />
               </div>
          </div>
     </div>
</div>
