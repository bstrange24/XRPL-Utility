<!-- Auth section - Radio Buttons -->
<div class="space-y-4">
     <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Action</label>
          <div class="flex flex-wrap gap-6 mt-2">
               <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="authAction" value="authorize" [checked]="authAction === 'authorize'" (change)="setAuthAction('authorize')" class="w-4 h-4 text-amber-600 focus:ring-amber-500" />
                    <ng-icon name="heroCheckCircle" size="22" class="text-amber-600"></ng-icon>
                    <span class="text-sm font-medium text-gray-700">Authorize</span>
               </label>

               <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="authAction" value="unauthorize" [checked]="authAction === 'unauthorize'" (change)="setAuthAction('unauthorize')" class="w-4 h-4 text-green-600 focus:ring-green-500" />
                    <ng-icon name="heroXCircle" size="22" class="text-red-600"></ng-icon>
                    <span class="text-sm font-medium text-gray-700">Unauthorize</span>
               </label>
          </div>
     </div>

     <!-- MPT Issuer -->
     <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">MPT Issuer</label>
          <p class="text-xs text-gray-500 mb-2">Account that issued the MPT.</p>
          <div class="h-[54px]">
               <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
          </div>
     </div>

     <!-- MPT Issuance ID -->
     <div style="margin-top: 0rem">
          <label class="block text-sm font-medium text-gray-700 mb-1">MPT Issuance ID</label>
          <p class="text-xs text-gray-500 mb-2">Identifies the MPTokenIssuance.</p>
          <input type="text" [ngModel]="mptIssuanceId" (ngModelChange)="setMptIssuanceId($event)" name="mptIssuanceIdField" placeholder="Enter MPT Issuance ID" class="w-full rounded-2xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent" />
     </div>
</div>
