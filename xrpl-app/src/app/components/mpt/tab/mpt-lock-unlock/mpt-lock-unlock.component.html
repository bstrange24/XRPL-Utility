<div class="space-y-4">
     <div>
          <label class="block text-sm font-medium text-gray-900 mb-1">Action</label>
          <div class="flex flex-wrap gap-6 mt-2 mb-2">
               <!-- Unlock Radio -->
               <label class="relative flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="lockAction" value="unlock" [checked]="mptStoreService.lockAction() === 'unlock'" (change)="mptStoreService.setField('lockAction', 'unlock')" class="hidden" />

                    <div class="w-5 h-5 rounded-full border-2 transition-all duration-200" [class.border-purple-500]="mptStoreService.lockAction() === 'unlock'" [class.border-gray-300]="mptStoreService.lockAction() !== 'unlock'">
                         <div class="w-full h-full rounded-full transition-transform duration-200 bg-purple-500" [class.scale-100]="mptStoreService.lockAction() === 'unlock'" [class.scale-0]="mptStoreService.lockAction() !== 'unlock'"></div>
                    </div>

                    <ng-icon name="heroLockOpen" size="20" class="text-purple-600 group-hover:text-purple-700 transition-colors"></ng-icon>
                    <span class="text-sm font-medium text-gray-900 group-hover:text-gray-700 transition-colors">Unlock</span>
               </label>

               <!-- Lock Radio -->
               <label class="relative flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="lockAction" value="lock" [checked]="mptStoreService.lockAction() === 'lock'" (change)="mptStoreService.setField('lockAction', 'lock')" class="hidden" />

                    <div class="w-5 h-5 rounded-full border-2 transition-all duration-200" [class.border-red-500]="mptStoreService.lockAction() === 'lock'" [class.border-gray-300]="mptStoreService.lockAction() !== 'lock'">
                         <div class="w-full h-full rounded-full transition-transform duration-200 bg-red-500" [class.scale-100]="mptStoreService.lockAction() === 'lock'" [class.scale-0]="mptStoreService.lockAction() !== 'lock'"></div>
                    </div>

                    <ng-icon name="heroLockClosed" size="20" class="text-red-600 group-hover:text-red-700 transition-colors"></ng-icon>
                    <span class="text-sm font-medium text-gray-900 group-hover:text-gray-700 transition-colors">Lock</span>
               </label>
          </div>
     </div>

     <!-- MPT Issuer -->
     <div>
          <label class="block text-sm font-medium text-gray-900 mb-1">MPT Issuer</label>
          <p class="text-xs text-gray-500 mb-2">Account that issued the MPT.</p>
          <div class="h-[54px]">
               <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" class="w-full" />
          </div>
     </div>

     <!-- MPT Issuance ID -->
     <div style="margin-top: 0rem">
          <label class="block text-sm font-medium text-gray-900 mb-1">MPT Issuance ID</label>
          <p class="text-xs text-gray-500 mb-2">Identifies the MPTokenIssuance.</p>
          <input type="text" [ngModel]="mptIssuanceId" (ngModelChange)="setMptIssuanceId($event)" name="mptIssuanceIdField" placeholder="Enter MPT Issuance ID" class="w-full rounded-2xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all" />
     </div>
</div>
