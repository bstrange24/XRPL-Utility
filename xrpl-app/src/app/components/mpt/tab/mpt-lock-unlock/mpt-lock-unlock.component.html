<!-- Action Radio Buttons -->
<div class="space-y-4">
     <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Action</label>
          <div class="flex flex-wrap gap-6 mt-2 mb-2">
               <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="lockAction" value="unlock" [checked]="mptStoreService.lockAction() === 'unlock'" (change)="mptStoreService.setField('lockAction', 'unlock')" class="w-4 h-4 text-blue-600 focus:ring-blue-500" />
                    <ng-icon name="heroLockOpen" size="20" class="text-purple-600 group-hover:text-purple-700 transition-colors"></ng-icon>
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900 transition-colors">Unlock</span>
               </label>

               <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="lockAction" value="lock" [checked]="mptStoreService.lockAction() === 'lock'" (change)="mptStoreService.setField('lockAction', 'lock')" class="w-4 h-4 text-blue-600 focus:ring-blue-500" />
                    <ng-icon name="heroLockClosed" size="20" class="text-red-600 group-hover:text-red-700 transition-colors"></ng-icon>
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900 transition-colors">Lock</span>
               </label>
          </div>
     </div>

     <!-- MPT Issuer -->
     <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">MPT Issuer</label>
          <p class="text-xs text-gray-500 mb-2">Account that issued the MPT.</p>
          <div class="h-[54px]">
               <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" class="w-full" />
          </div>
     </div>

     <!-- MPT Issuance ID -->
     <div style="margin-top: 0rem">
          <label class="block text-sm font-medium text-gray-700 mb-1">MPT Issuance ID</label>
          <p class="text-xs text-gray-500 mb-2">Identifies the MPTokenIssuance.</p>
          <input type="text" [ngModel]="mptIssuanceId" (ngModelChange)="setMptIssuanceId($event)" name="mptIssuanceIdField" placeholder="Enter MPT Issuance ID" class="w-full rounded-2xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent" />
     </div>
</div>
