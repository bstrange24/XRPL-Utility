<div class="card-base">
     <div class="space-y-6">
          <h4 class="mb-5 font-semibold text-gray-900">MPT Details</h4>
          <!-- Action Selection -->
          <div>
               <label for="mptAction" class="mb-3 block text-sm font-semibold text-gray-900">Action</label>

               <div class="flex flex-wrap gap-6">
                    <!-- Unlock Radio -->
                    <label class="relative flex cursor-pointer items-center gap-2 group">
                         <input type="radio" name="lockAction" value="unlock" [checked]="mptStoreService.lockAction() === 'unlock'" (change)="mptStoreService.setField('lockAction', 'unlock')" class="hidden" />

                         <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-purple-500]="mptStoreService.lockAction() === 'unlock'" [class.border-gray-300]="mptStoreService.lockAction() !== 'unlock'">
                              <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-purple-500" [class.scale-100]="mptStoreService.lockAction() === 'unlock'" [class.scale-0]="mptStoreService.lockAction() !== 'unlock'"></div>
                         </div>

                         <ng-icon name="heroLockOpen" size="18" class="text-purple-600 transition-colors group-hover:text-purple-700"></ng-icon>
                         <span class="text-sm font-medium text-gray-900 transition-colors group-hover:text-gray-700">Unlock</span>
                    </label>

                    <!-- Lock Radio -->
                    <label class="relative flex cursor-pointer items-center gap-2 group">
                         <input type="radio" name="lockAction" value="lock" [checked]="mptStoreService.lockAction() === 'lock'" (change)="mptStoreService.setField('lockAction', 'lock')" class="hidden" />

                         <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-red-500]="mptStoreService.lockAction() === 'lock'" [class.border-gray-300]="mptStoreService.lockAction() !== 'lock'">
                              <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-red-500" [class.scale-100]="mptStoreService.lockAction() === 'lock'" [class.scale-0]="mptStoreService.lockAction() !== 'lock'"></div>
                         </div>

                         <ng-icon name="heroLockClosed" size="18" class="text-red-600 transition-colors group-hover:text-red-700"></ng-icon>
                         <span class="text-sm font-medium text-gray-900 transition-colors group-hover:text-gray-700">Lock</span>
                    </label>
               </div>
          </div>

          <!-- MPT Issuer -->
          <div class="space-y-2">
               <label for="mptIssuer" class="label-primary">MPT Issuer</label>
               <p class="text-secondary">Account that issued the MPT.</p>

               <div class="h-[54px]">
                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
               </div>
          </div>

          <!-- MPT Issuance ID -->
          <div class="space-y-2">
               <label for="mptIssuanceID" class="label-primary">MPT Issuance ID</label>
               <p class="text-secondary">Identifies the MPTokenIssuance.</p>

               <input type="text" [ngModel]="mptIssuanceId" (ngModelChange)="setMptIssuanceId($event)" name="mptIssuanceIdField" placeholder="Enter MPT Issuance ID" class="input-base" />
          </div>
     </div>
</div>
