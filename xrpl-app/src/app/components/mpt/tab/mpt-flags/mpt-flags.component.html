<div class="rounded-2xl border border-gray-200 bg-white p-4">
     <!-- Header - More compact -->
     <div class="flex items-center gap-2 mb-3">
          <lucide-icon name="flag" size="18" class="text-gray-700" />
          <span class="text-base font-semibold text-gray-900">MPT Flags</span>
     </div>

     <div class="space-y-2">
          <!-- canLock -->
          <button type="button" class="w-full flex items-start gap-3 p-3 rounded-xl border border-gray-200 transition-all hover:bg-gray-50" [class.border-green-300]="mptUtilService.flags.canLock" [class.bg-green-50]="mptUtilService.flags.canLock" (click)="mptUtilService.toggleFlag('canLock')">
               <input type="checkbox" [checked]="mptUtilService.flags.canLock" class="mt-0.5 accent-green-600 cursor-pointer" />
               <div class="flex-1 text-left">
                    <div class="font-medium text-sm text-gray-900">MPTCanLock</div>
                    <div class="text-xs text-gray-500 font-mono">0x00000002</div>
                    <div class="text-xs text-gray-600 mt-0.5">The MPT can be locked both individually and globally.</div>
               </div>
          </button>

          <!-- MPTRequireAuth -->
          <button type="button" class="w-full flex items-start gap-3 p-3 rounded-xl border border-gray-200 transition-all hover:bg-gray-50" [class.border-green-300]="mptUtilService.flags.isRequireAuth" [class.bg-green-50]="mptUtilService.flags.isRequireAuth" (click)="mptUtilService.toggleFlag('isRequireAuth')">
               <input type="checkbox" [checked]="mptUtilService.flags.isRequireAuth" class="mt-0.5 accent-green-600 cursor-pointer" />
               <div class="flex-1 text-left">
                    <div class="font-medium text-sm text-gray-900">MPTRequireAuth</div>
                    <div class="text-xs text-gray-500 font-mono">0x00000004</div>
                    <div class="text-xs text-gray-600 mt-0.5">Individual holders must be authorized.</div>
               </div>
          </button>

          <!-- MPTCanEscrow -->
          <button type="button" class="w-full flex items-start gap-3 p-3 rounded-xl border border-gray-200 transition-all hover:bg-gray-50" [class.border-green-300]="mptUtilService.flags.canEscrow" [class.bg-green-50]="mptUtilService.flags.canEscrow" (click)="mptUtilService.toggleFlag('canEscrow')">
               <input type="checkbox" [checked]="mptUtilService.flags.canEscrow" class="mt-0.5 accent-green-600 cursor-pointer" />
               <div class="flex-1 text-left">
                    <div class="font-medium text-sm text-gray-900">MPTCanEscrow</div>
                    <div class="text-xs text-gray-500 font-mono">0x00000008</div>
                    <div class="text-xs text-gray-600 mt-0.5">Holders can place balances into escrow.</div>
               </div>
          </button>

          <!-- MPTCanTrade -->
          <button type="button" class="w-full flex items-start gap-3 p-3 rounded-xl border border-gray-200 transition-all hover:bg-gray-50" [class.border-green-300]="mptUtilService.flags.canTrade" [class.bg-green-50]="mptUtilService.flags.canTrade" (click)="mptUtilService.toggleFlag('canTrade')">
               <input type="checkbox" [checked]="mptUtilService.flags.canTrade" class="mt-0.5 accent-green-600 cursor-pointer" />
               <div class="flex-1 text-left">
                    <div class="font-medium text-sm text-gray-900">MPTCanTrade</div>
                    <div class="text-xs text-gray-500 font-mono">0x00000010</div>
                    <div class="text-xs text-gray-600 mt-0.5">Holders can trade on DEX or AMM.</div>
               </div>
          </button>

          <!-- MPTCanTransfer -->
          <button type="button" class="w-full flex items-start gap-3 p-3 rounded-xl border border-gray-200 transition-all hover:bg-gray-50" [class.border-green-300]="mptUtilService.flags.canTransfer" [class.bg-green-50]="mptUtilService.flags.canTransfer" (click)="mptUtilService.toggleFlag('canTransfer')">
               <input type="checkbox" [checked]="mptUtilService.flags.canTransfer" class="mt-0.5 accent-green-600 cursor-pointer" />
               <div class="flex-1 text-left">
                    <div class="font-medium text-sm text-gray-900">MPTCanTransfer</div>
                    <div class="text-xs text-gray-500 font-mono">0x00000020</div>
                    <div class="text-xs text-gray-600 mt-0.5">Tokens can be transferred to other accounts.</div>
               </div>
          </button>

          <!-- MPTCanClawback -->
          <button type="button" class="w-full flex items-start gap-3 p-3 rounded-xl border border-gray-200 transition-all hover:bg-gray-50" [class.border-green-300]="mptUtilService.flags.canClawback" [class.bg-green-50]="mptUtilService.flags.canClawback" (click)="mptUtilService.toggleFlag('canClawback')">
               <input type="checkbox" [checked]="mptUtilService.flags.canClawback" class="mt-0.5 accent-green-600 cursor-pointer" />
               <div class="flex-1 text-left">
                    <div class="font-medium text-sm text-gray-900">MPTCanClawback</div>
                    <div class="text-xs text-gray-500 font-mono">0x00000040</div>
                    <div class="text-xs text-gray-600 mt-0.5">Issuer can clawback value from holders.</div>
               </div>
          </button>
     </div>

     <!-- Total Flags Value - More compact -->
     <div class="mt-4 pt-3 border-t border-gray-100">
          <div class="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2">
               <span class="text-xs font-medium text-gray-600">Total Flags Value</span>
               <span class="font-mono font-semibold text-sm text-gray-800">
                    {{ mptUtilService.totalFlagsValue() }}
                    <span class="text-gray-400 text-xs">({{ mptUtilService.totalFlagsHex() }})</span>
               </span>
          </div>
     </div>
</div>
