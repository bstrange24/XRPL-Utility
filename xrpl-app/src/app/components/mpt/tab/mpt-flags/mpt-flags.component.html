<div class="card-base">
     <!-- Header -->
     <div class="mb-4 flex items-center gap-2">
          <lucide-icon name="flag" size="18" class="section-heading-icon-green" />
          <span class="text-sm font-semibold text-gray-900">MPT Flags</span>
     </div>

     <div class="space-y-3">
          <!-- canLock -->
          <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="mptUtilService.flags().canLock" [class.bg-green-50]="mptUtilService.flags().canLock">
               <input type="checkbox" [checked]="mptUtilService.flags().canLock" (change)="mptUtilService.toggleFlag('canLock')" class="hidden" />

               <div class="mt-0.5 flex-shrink-0">
                    <div class="flex h-5 w-5 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="mptUtilService.flags().canLock" [class.border-gray-300]="!mptUtilService.flags().canLock" [class.bg-green-500]="mptUtilService.flags().canLock">
                         @if (mptUtilService.flags().canLock) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </div>
               </div>

               <div class="flex-1">
                    <div class="text-sm font-medium text-gray-900">MPTCanLock</div>
                    <div class="mt-0.5 font-mono text-xs text-gray-500">0x00000002</div>
                    <div class="mt-0.5 text-xs text-gray-600">The MPT can be locked both individually and globally.</div>
               </div>
          </label>

          <!-- MPTRequireAuth -->
          <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="mptUtilService.flags().isRequireAuth" [class.bg-green-50]="mptUtilService.flags().isRequireAuth">
               <input type="checkbox" [checked]="mptUtilService.flags().isRequireAuth" (change)="mptUtilService.toggleFlag('isRequireAuth')" class="hidden" />

               <div class="mt-0.5 flex-shrink-0">
                    <div class="flex h-5 w-5 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="mptUtilService.flags().isRequireAuth" [class.border-gray-300]="!mptUtilService.flags().isRequireAuth" [class.bg-green-500]="mptUtilService.flags().isRequireAuth">
                         @if (mptUtilService.flags().isRequireAuth) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </div>
               </div>

               <div class="flex-1">
                    <div class="text-sm font-medium text-gray-900">MPTRequireAuth</div>
                    <div class="mt-0.5 font-mono text-xs text-gray-500">0x00000004</div>
                    <div class="mt-0.5 text-xs text-gray-600">Individual holders must be authorized.</div>
               </div>
          </label>

          <!-- MPTCanEscrow -->
          <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="mptUtilService.flags().canEscrow" [class.bg-green-50]="mptUtilService.flags().canEscrow">
               <input type="checkbox" [checked]="mptUtilService.flags().canEscrow" (change)="mptUtilService.toggleFlag('canEscrow')" class="hidden" />

               <div class="mt-0.5 flex-shrink-0">
                    <div class="flex h-5 w-5 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="mptUtilService.flags().canEscrow" [class.border-gray-300]="!mptUtilService.flags().canEscrow" [class.bg-green-500]="mptUtilService.flags().canEscrow">
                         @if (mptUtilService.flags().canEscrow) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </div>
               </div>

               <div class="flex-1">
                    <div class="text-sm font-medium text-gray-900">MPTCanEscrow</div>
                    <div class="mt-0.5 font-mono text-xs text-gray-500">0x00000008</div>
                    <div class="mt-0.5 text-xs text-gray-600">Holders can place balances into escrow.</div>
               </div>
          </label>

          <!-- MPTCanTrade -->
          <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="mptUtilService.flags().canTrade" [class.bg-green-50]="mptUtilService.flags().canTrade">
               <input type="checkbox" [checked]="mptUtilService.flags().canTrade" (change)="mptUtilService.toggleFlag('canTrade')" class="hidden" />

               <div class="mt-0.5 flex-shrink-0">
                    <div class="flex h-5 w-5 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="mptUtilService.flags().canTrade" [class.border-gray-300]="!mptUtilService.flags().canTrade" [class.bg-green-500]="mptUtilService.flags().canTrade">
                         @if (mptUtilService.flags().canTrade) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </div>
               </div>

               <div class="flex-1">
                    <div class="text-sm font-medium text-gray-900">MPTCanTrade</div>
                    <div class="mt-0.5 font-mono text-xs text-gray-500">0x00000010</div>
                    <div class="mt-0.5 text-xs text-gray-600">Holders can trade on DEX or AMM.</div>
               </div>
          </label>

          <!-- MPTCanTransfer -->
          <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="mptUtilService.flags().canTransfer" [class.bg-green-50]="mptUtilService.flags().canTransfer">
               <input type="checkbox" [checked]="mptUtilService.flags().canTransfer" (change)="mptUtilService.toggleFlag('canTransfer')" class="hidden" />

               <div class="mt-0.5 flex-shrink-0">
                    <div class="flex h-5 w-5 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="mptUtilService.flags().canTransfer" [class.border-gray-300]="!mptUtilService.flags().canTransfer" [class.bg-green-500]="mptUtilService.flags().canTransfer">
                         @if (mptUtilService.flags().canTransfer) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </div>
               </div>

               <div class="flex-1">
                    <div class="text-sm font-medium text-gray-900">MPTCanTransfer</div>
                    <div class="mt-0.5 font-mono text-xs text-gray-500">0x00000020</div>
                    <div class="mt-0.5 text-xs text-gray-600">Tokens can be transferred to other accounts.</div>
               </div>
          </label>

          <!-- MPTCanClawback -->
          <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="mptUtilService.flags().canClawback" [class.bg-green-50]="mptUtilService.flags().canClawback">
               <input type="checkbox" [checked]="mptUtilService.flags().canClawback" (change)="mptUtilService.toggleFlag('canClawback')" class="hidden" />

               <div class="mt-0.5 flex-shrink-0">
                    <div class="flex h-5 w-5 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="mptUtilService.flags().canClawback" [class.border-gray-300]="!mptUtilService.flags().canClawback" [class.bg-green-500]="mptUtilService.flags().canClawback">
                         @if (mptUtilService.flags().canClawback) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </div>
               </div>

               <div class="flex-1">
                    <div class="text-sm font-medium text-gray-900">MPTCanClawback</div>
                    <div class="mt-0.5 font-mono text-xs text-gray-500">0x00000040</div>
                    <div class="mt-0.5 text-xs text-gray-600">Issuer can clawback value from holders.</div>
               </div>
          </label>
     </div>

     <!-- Total Flags -->
     <div class="mt-5 border-t border-gray-100 pt-4">
          <div class="flex items-center justify-between rounded-xl bg-gray-50 px-3 py-2">
               <span class="text-xs font-medium text-gray-600">Total Flags Value</span>
               <span class="font-mono text-sm font-semibold text-gray-800">
                    {{ mptUtilService.totalFlagsValue() }}
                    <span class="text-xs text-gray-400">({{ mptUtilService.totalFlagsHex() }})</span>
               </span>
          </div>
     </div>
</div>
