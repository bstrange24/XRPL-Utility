<div class="card-base">
     <div class="space-y-6">
          <h4 class="section-heading">
               <lucide-icon name="gem" class="section-heading-icon-green"></lucide-icon>
               MPT Details
          </h4>

          <!-- Select MPT -->
          <div>
               <label for="selectMpt" class="label-primary">Select MPT <span class="text-red-500">*</span></label>
               <p class="text-secondary">MPT this account holds that can be sent to another account.</p>
               <app-select-search-dropdown [items]="viewModel.mptItems()" [value]="viewModel.selectedMptItem()" (valueChange)="onMptSelected.emit($event)" placeholder="Search by ID or amount..." emptyMessage="No MPTs available" />
          </div>

          <!-- MPT Issuance ID -->
          <div>
               <label for="mptIssuanceID" class="label-primary">MPT Issuance ID <span class="text-red-500">*</span></label>
               <p class="text-secondary">Identifies the MPTokenIssuance.</p>
               <input type="text" [ngModel]="mptStoreService.mptIssuanceId()" (ngModelChange)="mptStoreService.setField('mptIssuanceId', $event)" class="input-base" />
          </div>

          <!-- Destination + Amount -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <!-- Destination -->
               <div>
                    <label for="mptDestination" class="label-primary">Destination <span class="text-red-500">*</span></label>
                    <p class="text-secondary">The unique address of the account receiving the MPT.</p>
                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
               </div>

               <!-- MPT Amount -->
               <div>
                    <label for="mptAmount" class="label-primary">MPT Amount <span class="text-red-500">*</span></label>
                    <p class="text-secondary">Amount of MPT to send. Make sure the receiving account is authorized.</p>
                    <input type="number" [ngModel]="mptStoreService.amount()" (ngModelChange)="mptStoreService.setField('amount', $event)" placeholder="e.g. 1000" min="1" step="1" max="10000000000000000" class="input-base" />
               </div>
          </div>
     </div>
</div>
