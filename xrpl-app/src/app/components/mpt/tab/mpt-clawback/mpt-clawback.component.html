<div class="form-row">
     <div class="form-group">
          <label for="selectMptToClawback">Select MPT to Clawback</label>
          <p class="form-hint">MPT to clawback.</p>
          <app-select-search-dropdown [items]="viewModel.mptItems()" [value]="viewModel.selectedMptItem()" (valueChange)="onMptSelected.emit($event)" placeholder="Search by ID or amount..." emptyMessage="No MPTs available"> </app-select-search-dropdown>
     </div>
</div>

<div class="form-row">
     <div class="form-group">
          <label for="clawbackMptIssuanceId">MPT Issuance ID</label>
          <p class="form-hint">Identifies the MPTokenIssuance.</p>
          <input type="text" [ngModel]="mptStoreService.mptIssuanceId()" (ngModelChange)="mptStoreService.setField('mptIssuanceId', $event)" name="mptIssuanceIdField" placeholder="" />
     </div>
</div>

<!-- Destination -->
<div class="form-row">
     <div class="form-group">
          <label for="destination">MPT Holder</label>
          <p class="form-hint">MPT holder address to clawback tokens from.</p>
          <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
     </div>

     <div class="form-group">
          <label for="amountToClawback">Amount to Clawback</label>
          <p class="form-hint">MPT amount to clawback form an existing holder.</p>
          <input type="number" [ngModel]="mptStoreService.amount()" (ngModelChange)="mptStoreService.setField('amount', $event)" name="amountField" placeholder="" min="1" step="1" />
     </div>
</div>
