<div class="card-base">
     <div class="space-y-6">
          <h4 class="section-heading">
               <lucide-icon name="gem" class="section-heading-icon-green"></lucide-icon>
               MPT Details
          </h4>

          <!-- Select MPT -->
          <div>
               <label for="selectMptToClawback" class="label-primary">Select MPT to Clawback <span class="text-red-500">*</span></label>
               <p class="text-secondary">MPT to clawback from a holder.</p>

               <app-select-search-dropdown [items]="viewModel.mptItems()" [value]="viewModel.selectedMptItem()" (valueChange)="onMptSelected.emit($event)" placeholder="Search by ID or amount..." emptyMessage="No MPTs available" />
          </div>

          <!-- MPT Issuance ID -->
          <div>
               <label for="mptIssuanceID" class="label-primary">MPT Issuance ID <span class="text-red-500">*</span></label>
               <p class="text-secondary">Identifies the MPTokenIssuance.</p>

               <input type="text" [ngModel]="mptStoreService.mptIssuanceId()" (ngModelChange)="mptStoreService.setField('mptIssuanceId', $event)" class="input-base" />
          </div>

          <!-- MPT Holder + Amount -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <!-- MPT Holder (Destination) -->
               <div>
                    <label for="mptHolder" class="label-primary">MPT Holder <span class="text-red-500">*</span></label>
                    <p class="text-secondary">MPT holder address to clawback tokens from.</p>

                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
               </div>

               <!-- Amount to Clawback -->
               <div>
                    <label for="amountToClawback" class="label-primary">Amount to Clawback <span class="text-red-500">*</span></label>
                    <p class="text-secondary">MPT amount to clawback from an existing holder.</p>

                    <input type="number" [ngModel]="mptStoreService.amount()" (ngModelChange)="mptStoreService.setField('amount', $event)" placeholder="e.g. 1000" min="1" max="10000000000000000" step="1" class="input-base" />
               </div>
          </div>
     </div>
</div>
