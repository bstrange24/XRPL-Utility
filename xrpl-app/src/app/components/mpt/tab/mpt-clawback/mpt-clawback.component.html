<div class="space-y-8">
     <!-- Select MPT -->
     <div class="space-y-2">
          <label class="text-sm font-medium">Select MPT to Clawback</label>
          <p class="text-xs text-gray-500">MPT to clawback from a holder.</p>

          <div class="h-[54px]">
               <app-select-search-dropdown [items]="viewModel.mptItems()" [value]="viewModel.selectedMptItem()" (valueChange)="onMptSelected.emit($event)" placeholder="Search by ID or amount..." emptyMessage="No MPTs available" />
          </div>
     </div>

     <!-- MPT Issuance ID -->
     <div class="space-y-2" style="margin-top: 0rem">
          <label class="text-sm font-medium">MPT Issuance ID</label>
          <p class="text-xs text-gray-500">Identifies the MPTokenIssuance.</p>

          <input type="text" [ngModel]="mptStoreService.mptIssuanceId()" (ngModelChange)="mptStoreService.setField('mptIssuanceId', $event)" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" />
     </div>

     <!-- MPT Holder + Amount -->
     <div class="grid grid-cols-1 md:grid-cols-2 gap-6" style="margin-top: 0.5rem">
          <!-- MPT Holder (Destination) -->
          <div class="space-y-2">
               <label class="text-sm font-medium">MPT Holder</label>
               <p class="text-xs text-gray-500">MPT holder address to clawback tokens from.</p>

               <div class="h-[54px]">
                    <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" (valueChange)="onDestinationChange($event)" placeholder="Enter or select destination address" />
               </div>
          </div>

          <!-- Amount to Clawback -->
          <div class="space-y-2">
               <label class="text-sm font-medium">Amount to Clawback</label>
               <p class="text-xs text-gray-500">MPT amount to clawback from an existing holder.</p>

               <input type="number" [ngModel]="mptStoreService.amount()" (ngModelChange)="mptStoreService.setField('amount', $event)" placeholder="e.g. 1000" min="1" step="1" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" />
          </div>
     </div>
</div>
