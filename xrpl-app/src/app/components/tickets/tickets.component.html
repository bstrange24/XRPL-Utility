<!-- Get view -->
@let viewModel = ticketsViewModelService;
<!-- Get active tab -->
@let tab = viewModel.activeTab();

<div class="p-1">
     <div>
          <!-- Menu / Tabs -->
          <app-tab-menu-with-info [tabs]="tabs" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)"> </app-tab-menu-with-info>

          <!-- Warning Message -->
          @if (txUiService.warningMessage) {
          <app-warning-message [warningMessage]="safeWarningMessage()"></app-warning-message>
          }

          <!-- Form -->
          <form #theForm="ngForm">
               <!-- Dynamic Content -->
               @if (tab === 'createTicket') {
               <app-tickets-create></app-tickets-create>
               } @if (tab === 'deleteTicket' && xrplTxOptionsStore.walletTicketCount() > 0) {
               <app-tickets-delete></app-tickets-delete>
               }

               <!-- Transaction Options -->
               <app-transaction-options [showWhenTab]="['createTicket', 'deleteTicket']" [activeTab]="viewModel.activeTab" [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()" [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"> </app-transaction-options>

               <!-- Action Buttons -->
               <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <!-- Primary Button -->
                    @if (tab === 'createTicket') {
                    <button type="button" (click)="performAction()" [disabled]="!isIdle() || !hasWallets()" class="btn-primary whitespace-nowrap">{{ ticketsUtilService.createButtonLabel() }}</button>
                    } @else if (tab === 'deleteTicket') {
                    <button type="button" (click)="performAction()" [disabled]="!isIdle() || !hasWallets()" class="btn-red whitespace-nowrap">{{ ticketsUtilService.deleteButtonLabel() }}</button>
                    }

                    <!-- Secondary Button -->
                    <div class="flex flex-wrap items-center justify-end gap-2">
                         <button type="button" (click)="clearInputFields()" [disabled]="!isIdle() || !hasWallets()" class="btn-secondary whitespace-nowrap">Clear Fields</button>
                    </div>
               </div>

               <!-- Execution Time -->
               <div class="text-sm text-gray-500 mt-3">
                    <app-execution-time-display [time]="executionTime()"></app-execution-time-display>
               </div>

               <!-- Transaction Preview -->
               <div class="pt-2">
                    <app-transaction-preview></app-transaction-preview>
               </div>
          </form>
     </div>
</div>
