<div class="space-y-2">
     <div class="card-base">
          <h4 class="section-heading">
               <ng-icon name="heroTicket" class="section-heading-icon-green"></ng-icon>
               Ticket Details
          </h4>

          <div class="space-y-2">
               <label for="ticketToCreate" class="label-primary">Number of Tickets to Create</label>
               <p class="text-secondary">Number of Tickets to create for the selected account.</p>
               <input type="number" [ngModel]="xrplTxOptionsStore.ticketCountField()" (ngModelChange)="xrplTxOptionsStore.setField('ticketCountField', $event)" placeholder="1 - 250 (max per account)" min="1" max="250" class="input-base" />
          </div>
     </div>
</div>
