@if (infoData()) {
<app-summary-container [walletName]="walletName()" [summaryText]="infoData()" [itemCount]="this.xrplTxOptionsStore.walletTicketCount()" [buttonLabel]="'Tickets'" [emptyStateMessage]="emptyStateMessage()" [emptyStateSubMessage]="emptyStateSubMessage()" [infoPanelExpanded]="infoPanelExpanded()" (toggleInfoPanel)="toggleInfoPanel.emit()" [variant]="'green'">
     <!-- Optional: if you support color variants -->

     <!-- Items List (only shown when there are tickets) -->
     <div items-list>
          <!-- Your ticket items go here when you add them later -->
          <!-- Example: -->
          <!-- @for (ticket of tickets(); track ticket.index) { ... } -->
     </div>
</app-summary-container>
}
