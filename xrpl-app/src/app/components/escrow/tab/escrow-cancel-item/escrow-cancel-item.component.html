<!-- Main Content -->
<div class="summary-item-content">
     <!-- Status Icon -->
     @if (escrow.isExpired) {
     <ng-icon name="heroExclamationTriangle" size="20" class="text-red-500 mt-0.5 flex-shrink-0" />
     } @else {
     <ng-icon name="heroClock" size="20" class="text-gray-400 mt-0.5 flex-shrink-0" />
     }

     <div class="flex-1 min-w-0">
          <!-- Amount + Expired Badge -->
          <div class="flex items-center gap-2 flex-wrap">
               <app-tooltip-link [href]="txUiService.explorerUrl() + 'ledger/' + escrow.EscrowSequence" tooltipText="View Escrow on XRPL Explorer">
                    <strong class="text-gray-900 hover:text-blue-600 transition-colors" [class.text-red-500]="escrow.isExpired"> {{ escrow.amount }} </strong>
                    @if (escrow.isExpired) {
                    <span class="px-2.5 py-0.5 text-xs font-medium bg-red-100 text-red-700 rounded-full"> Expired </span>
                    }
               </app-tooltip-link>
          </div>

          <!-- Metadata -->
          <div class="mt-3 text-sm">
               <app-summary-key-value label="Sequence">
                    <span class="font-mono">{{ escrow.EscrowSequence }}</span>
               </app-summary-key-value>

               <app-summary-key-value label="{{ escrow.isExpired ? 'Finished at' : 'Finishes at or after' }}">
                    <span class="font-mono" [class.text-red-600]="escrow.isExpired">{{ escrow.finishAfter ? utilsService.convertXRPLTime(escrow.finishAfter) : 'N/A' }}</span>
               </app-summary-key-value>

               <app-summary-key-value label="Cancellable after">
                    <span class="font-mono" [class.text-red-600]="escrow.isExpired">{{ escrow.cancelAfter ? utilsService.convertXRPLTime(escrow.cancelAfter) : 'N/A' }}</span>
               </app-summary-key-value>
          </div>
     </div>
</div>
