<div class="card-base">
     <h4 class="section-heading">
          <lucide-icon name="handshake" class="section-heading-icon-green"></lucide-icon>
          NFT Offer Details
     </h4>

     <div class="space-y-6">
          <!-- Currency + Amount -->
          <app-currency-amount-form
               [currencyItems]="checksTransactionViewModelService.currencyItems()"
               [selectedCurrencyItem]="checksTransactionViewModelService.selectedCurrencyItem()"
               [amount]="nftCreateStoreService.amount()"
               [currency]="currencyStoreService.currency()"
               [issuerItems]="checksTransactionViewModelService.issuerItems()"
               [selectedIssuerItem]="checksTransactionViewModelService.selectedIssuerItem()"
               [balance]="currencyStoreService.balance()"
               (currencySelected)="currencySelected.emit($event)"
               (amountChange)="utilsService.updateAmount($event, 'nftCreate')"
               (issuerSelected)="issuerSelected.emit($event)"
          >
          </app-currency-amount-form>

          <!-- NFT Token ID -->
          <div class="space-y-2">
               <label for="nftTokenID" class="label-primary">NFT Token ID</label>
               <p class="text-secondary">NFT Token ID generated when the NFT was created.</p>

               <input type="text" [(ngModel)]="nftCreateStoreService.nftId" name="nftIdField" class="input-base" />
          </div>

          <!-- Expiration + Owner -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
               <!-- Expiration -->
               <div class="rounded-2xl p-1 transition-shadow">
                    <app-xrpl-expiration-input [expirationSignal]="nftCreateStoreService.expiration" [setExpiration]="setNftExpirationDate" label="NFT Offer Expiration Date (optional)" hint="NFT offer expiration when the offer will expire."> </app-xrpl-expiration-input>
               </div>

               <!-- Owner -->
               <div class="space-y-2">
                    <label for="nftOwner" class="label-primary">Owner</label>
                    <p class="text-secondary">Owner of the NFT (usually your own address for sell offers).</p>

                    <input type="text" [(ngModel)]="nftCreateStoreService.nftOwnerAddress" name="ownerField" class="input-base" />
               </div>
          </div>
     </div>
</div>
