<div class="space-y-8">
     <!-- Select Offer to Cancel -->
     <div class="space-y-2">
          <label class="text-sm font-medium">Select Offer to Cancel</label>
          <p class="text-xs text-gray-500">Select an existing NFT offer to cancel.</p>

          <app-select-search-dropdown [items]="nftOffersTransactionViewModelService.offerItems()" [value]="selectedOfferItem()" (valueChange)="onOfferSelected($event)" placeholder="Search by amount, NFT ID, or offer ID..." emptyMessage="No cancellable offers" />
     </div>

     <!-- NFT Offer ID -->
     <div class="space-y-2">
          <label class="text-sm font-medium">NFT Offer ID</label>
          <p class="text-xs text-gray-500">NFT Offer ID generated when the offer was created.</p>

          <input type="text" [(ngModel)]="nftCreateStoreService.nftOfferId" name="nftOfferIdField" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" />
     </div>
</div>
