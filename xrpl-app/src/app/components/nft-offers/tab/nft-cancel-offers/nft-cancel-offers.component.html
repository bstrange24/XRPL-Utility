<div class="space-y-6">
     <div class="card-base">
          <h4 class="section-heading">
               <lucide-icon name="handshake" class="section-heading-icon-green"></lucide-icon>
               NFT Offer Details
          </h4>

          <!-- Select Offer to Cancel -->
          <div class="space-y-2">
               <label for="selectNftOfferToCancel" class="label-primary">Select Offer to Cancel</label>
               <p class="text-secondary">Select an existing NFT offer to cancel.</p>

               <div class="h-[54px]">
                    <app-select-search-dropdown [items]="nftOffersTransactionViewModelService.offerItems()" [value]="selectedOfferItem()" (valueChange)="onOfferSelected($event)" placeholder="Search by amount, NFT ID, or offer ID..." emptyMessage="No cancellable offers" />
               </div>
          </div>

          <!-- NFT Offer ID -->
          <div class="space-y-2">
               <label for="nftOfferID" class="label-primary">NFT Offer ID</label>
               <p class="text-secondary">NFT Offer ID generated when the offer was created.</p>

               <input type="text" [(ngModel)]="nftCreateStoreService.nftOfferId" name="nftOfferIdField" class="input-base" />
          </div>
     </div>
</div>
