<div class="space-y-6">
     <!-- Configuration Templates -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5">
          <label class="block text-sm font-semibold text-gray-700 mb-3"> Configuration Templates </label>

          <div class="flex flex-wrap gap-3">
               <label class="cursor-pointer flex-1 min-w-[140px]">
                    <input
                         type="radio"
                         name="configurationType"
                         value="holder"
                         [checked]="configurationType() === 'holder'"
                         (change)="accountConfiguratorStoreService.setField('configurationType', 'holder'); 
                                     accountConfiguratorUtilService.onConfigurationChange()"
                         class="peer sr-only"
                    />
                    <div class="peer-checked:border-green-600 peer-checked:bg-green-50 border border-gray-200 rounded-2xl p-4 hover:bg-gray-50 transition-all text-center">
                         <div class="font-medium text-gray-900">Holder</div>
                         <div class="text-xs text-gray-500 mt-1">Default / Receiving assets</div>
                    </div>
               </label>

               <label class="cursor-pointer flex-1 min-w-[140px]">
                    <input
                         type="radio"
                         name="configurationType"
                         value="exchanger"
                         [checked]="configurationType() === 'exchanger'"
                         (change)="accountConfiguratorStoreService.setField('configurationType', 'exchanger'); 
                                     accountConfiguratorUtilService.onConfigurationChange()"
                         class="peer sr-only"
                    />
                    <div class="peer-checked:border-green-600 peer-checked:bg-green-50 border border-gray-200 rounded-2xl p-4 hover:bg-gray-50 transition-all text-center">
                         <div class="font-medium text-gray-900">Exchanger</div>
                         <div class="text-xs text-gray-500 mt-1">Trading / Liquidity</div>
                    </div>
               </label>

               <label class="cursor-pointer flex-1 min-w-[140px]">
                    <input
                         type="radio"
                         name="configurationType"
                         value="issuer"
                         [checked]="configurationType() === 'issuer'"
                         (change)="accountConfiguratorStoreService.setField('configurationType', 'issuer'); 
                                     accountConfiguratorUtilService.onConfigurationChange()"
                         class="peer sr-only"
                    />
                    <div class="peer-checked:border-green-600 peer-checked:bg-green-50 border border-gray-200 rounded-2xl p-4 hover:bg-gray-50 transition-all text-center">
                         <div class="font-medium text-gray-900">Issuer</div>
                         <div class="text-xs text-gray-500 mt-1">Token issuance</div>
                    </div>
               </label>
          </div>
     </div>

     <!-- Account Flags -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5">
          <div class="flex items-center gap-3 mb-5">
               <lucide-icon name="flag" size="22" class="text-gray-700" />
               <h4 class="font-semibold text-gray-900">Account Flags</h4>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
               @for (flag of accountConfiguratorUtilService.accountFlagsConfig; track flag.key) {
               <button type="button" class="group border border-gray-200 hover:border-green-300 rounded-2xl p-4 text-left transition-all hover:shadow-sm" [class.bg-green-50]="accountConfiguratorUtilService.flags[flag.key]" [class.border-green-300]="accountConfiguratorUtilService.flags[flag.key]" (click)="accountConfiguratorUtilService.toggleFlag(flag.key)">
                    <div class="flex items-start justify-between">
                         <div class="flex items-center gap-3">
                              <input type="checkbox" [id]="flag.key" [checked]="accountConfiguratorUtilService.flags[flag.key]" class="w-4 h-4 accent-green-600 cursor-pointer" />
                              <span class="font-medium text-gray-900">{{ flag.title }}</span>
                         </div>
                    </div>

                    <div class="mt-3 text-xs font-mono text-gray-500">{{ accountConfiguratorUtilService.FLAG_VALUES[flag.key] }} {{ flag.key }}</div>
                    <div class="mt-2 text-xs text-gray-600 line-clamp-2">{{ flag.desc }}</div>
               </button>
               }
          </div>

          <!-- Total Flags -->
          <div class="mt-6 p-4 bg-gray-50 rounded-2xl border border-gray-100">
               <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-700">Total Flags Value</span>
                    <span class="text-lg font-semibold font-mono text-gray-900">
                         {{ accountConfiguratorStoreService.totalFlagsValue() }}
                         <span class="text-xs text-gray-500">({{ accountConfiguratorStoreService.totalFlagsHex() }})</span>
                    </span>
               </div>
          </div>
     </div>

     <!-- Action Button -->
     <div class="pt-2">
          <button type="button" class="btn-primary w-full sm:w-auto px-8 py-3" (click)="performAction.emit('')" [disabled]="!canSubmit() || !connectionGuard.isConnectionReady()">{{ accountConfiguratorUtilService.modifyAccountFlagsButtonLabel() }}</button>
     </div>
</div>
