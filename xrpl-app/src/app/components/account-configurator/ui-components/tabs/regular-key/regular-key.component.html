<div class="space-y-6">
     <!-- Regular Key Configuration -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5">
          <div class="flex items-center gap-3 mb-5">
               <ng-icon name="heroKey" size="24" class="text-blue-600" />
               <h4 class="font-semibold text-gray-900">Regular Key Configuration</h4>
          </div>

          <p class="text-sm text-gray-600 mb-5">A secondary key that can sign transactions for your account. Useful for daily operations while keeping your master key secure.</p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
               <!-- Regular Key Address -->
               <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2"> Regular Key Address </label>
                    <p class="text-sm text-gray-600 mb-3">The account address to use as your regular key</p>
                    <input type="text" class="w-full border border-gray-200 focus:border-blue-500 rounded-2xl px-4 py-3 text-sm font-mono" [ngModel]="accountConfiguratorStoreService.regularKeyAddress()" (ngModelChange)="accountConfiguratorStoreService.setField('regularKeyAddress', $event)" placeholder="r..." />
               </div>

               <!-- Regular Key Seed -->
               <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2"> Regular Key Seed </label>
                    <p class="text-sm text-gray-600 mb-3">Secret seed for the regular key (optional for display)</p>
                    <input type="text" class="w-full border border-gray-200 focus:border-blue-500 rounded-2xl px-4 py-3 text-sm font-mono" [ngModel]="accountConfiguratorStoreService.regularKeySeed()" (ngModelChange)="accountConfiguratorStoreService.setField('regularKeySeed', $event)" placeholder="s..." />
               </div>
          </div>
     </div>

     <!-- Action Buttons -->
     <div class="flex flex-col sm:flex-row gap-3">
          <button type="button" class="flex-1 btn-primary py-3" (click)="performAction.emit('Y')" [disabled]="!canSubmit() || !connectionGuard.isConnectionReady()">{{ accountConfiguratorUtilService.setRegularKeyButtonLabel() }}</button>

          <button type="button" class="flex-1 btn-red py-3" (click)="performAction.emit('N')" [disabled]="!canSubmit() || !connectionGuard.isConnectionReady()">{{ accountConfiguratorUtilService.removeRegularKeyButtonLabel() }}</button>
     </div>
</div>
