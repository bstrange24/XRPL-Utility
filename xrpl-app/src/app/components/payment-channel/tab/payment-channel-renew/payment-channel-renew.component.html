<div class="space-y-6">
     <div class="card-base">
          <h4 class="section-heading">
               <lucide-icon name="signal" class="section-heading-icon-green"></lucide-icon>
               Payment Channel Details
          </h4>

          <!-- Select Payment Channel to Renew -->
          <label for="selectChannelToRenew" class="label-primary">Select Payment Channel to Renew</label>
          <p class="text-secondary">Select a channel you created (source account).</p>
          <app-select-search-dropdown [items]="viewModel.channelItems()" [value]="viewModel.selectedChannelItem()" (valueChange)="paymentChannelUtilService.setChannelId($event)" placeholder="Search by amount or channel Id..." emptyMessage="No Payment Channels available" />
     </div>

     @if (paymentChannelStoreService.channelIDField()) {
     <div class="card-base">
          <!-- Channel ID -->
          <label for="channelID" class="label-primary">Channel ID</label>
          <p class="text-secondary">The unique ID of the channel (64-character hex).</p>
          <input type="text" readonly class="input-disabled" [(ngModel)]="paymentChannelStoreService.channelIDField" name="channelIDField" />
     </div>
     }

     <!-- Expired warning for renewPaymentChannel tab -->
     @if (viewModel.selectedIsExpired()) {
     <div class="alert-error">
          <ng-icon name="heroExclamationTriangle" size="18" class="flex-shrink-0 alert-icon" />
          <div class="alert-content">This selected payment channel has expired.</div>
     </div>
     }
</div>
