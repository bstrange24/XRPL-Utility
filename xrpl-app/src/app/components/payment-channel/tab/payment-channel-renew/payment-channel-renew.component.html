<div class="space-y-6">
     <div class="card-base">
          <h4 class="section-heading">
               <lucide-icon name="signal" class="section-heading-icon-green"></lucide-icon>
               Payment Channel Details
          </h4>

          <!-- Select Payment Channel to Renew -->
          <div class="field-label">
               <label for="selectChannelToRenew" class="label-primary">Select Payment Channel to Renew <span class="text-red-500">*</span></label>
          </div>

          <div class="flex items-center gap-2">
               <p class="text-secondary">Select a channel you created (source account).</p>
               <button type="button" (click)="toggleChannelSelectorHelper()" class="text-gray-400 hover:text-gray-600 pb-2">
                    <ng-icon name="heroQuestionMarkCircle" size="14" />
               </button>
          </div>
          <div class="relative">
               <app-select-search-dropdown [items]="viewModel.channelItems()" [value]="viewModel.selectedChannelItem()" (valueChange)="paymentChannelUtilService.setChannelId($event)" placeholder="Search by amount or channel Id..." emptyMessage="No Payment Channels available" />
          </div>
          <app-field-helper title="Channel Selection" [items]="renewPaymentChannelDetailsHelperItems" [show]="showChannelSelectorHelper" />
     </div>

     @if (paymentChannelStoreService.channelIDField()) {
     <div class="card-base">
          <!-- Channel ID -->
          <div>
               <div class="field-label">
                    <label for="channelID" class="label-primary">Channel ID <span class="text-red-500">*</span></label>
               </div>

               <div class="flex items-center gap-2">
                    <p class="text-secondary">The unique Channel ID of the channel as a 64-character hexadecimal string.</p>
                    <button type="button" (click)="toggleChannelIdHelper()" class="text-gray-400 hover:text-gray-600 pb-2">
                         <ng-icon name="heroQuestionMarkCircle" size="14" />
                    </button>
               </div>

               <div class="relative">
                    <input type="text" name="channelIDField" readonly class="input-disabled" [ngModel]="paymentChannelStoreService.channelIDField()" (ngModelChange)="paymentChannelStoreService.setField('channelIDField', $event)" name="channelIDField" />
                    <!-- <input type="text" readonly class="input-disabled" [(ngModel)]="paymentChannelStoreService.channelIDField" name="channelIDField" /> -->
               </div>

               <app-field-helper title="Channel ID" [items]="channelIdHelperItems" [show]="showChannelIdHelper" />
          </div>
     </div>
     }

     <!-- Expired warning for renewPaymentChannel tab -->
     @if (viewModel.selectedIsExpired()) {
     <div class="alert-error">
          <ng-icon name="heroExclamationTriangle" size="18" class="alert-icon" />
          <div class="alert-content">This selected payment channel has expired.</div>
     </div>
     }
</div>
