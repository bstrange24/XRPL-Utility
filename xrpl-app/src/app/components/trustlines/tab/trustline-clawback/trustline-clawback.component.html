<div class="form-row">
     <div class="form-group">
          @if (activeTab === 'issueCurrency') {
          <label for="formTitle" class="dynamic-title">{{ viewModel.formTitle() }}</label>
          <p class="form-hint dynamic-hint">{{ viewModel.hintText() }}</p>
          } @else {
          <label for="formTitle">Token Holder</label>
          <p class="form-hint">The unique address of the account holding the tokens. Select destination from the dropdown or manually enter a new destination.</p>
          }
          <app-select-search-dropdown [items]="destinationItems()" [value]="selectedDestinationItem()" [searchQueryInput]="destinationSearchQuery()" (searchQueryChange)="searchQueryChange.emit($event)" (valueChange)="destinationChange.emit($event)" placeholder="Enter or select destination address" />
     </div>
</div>
