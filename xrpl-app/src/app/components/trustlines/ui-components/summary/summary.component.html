@if (info(); as trustlineInfo) {
<app-summary-container [walletName]="trustlineInfo.walletName" [summaryText]="summaryText()" [itemCount]="trustlineInfo.trustlineCount" [links]="trustlineInfo.helpHint ? '💡 ' + trustlineInfo.helpHint : null" [buttonLabel]="'trustlines'" [emptyStateMessage]="trustlineInfo.emptyMessage" [infoPanelExpanded]="isExpanded()" (toggleInfoPanel)="toggleExpanded.emit()">
     <div items-list>
          @for (tl of trustlineInfo.trustlinesToShow; track tl.currency + tl.issuer) {
          <app-summary-item [copyValue]="tl.issuer" copyTooltip="Copy Issuer Address" (onCopyClick)="copyIssuer($event)">
               <div item-content>
                    <div class="flex items-start gap-3">
                         <ng-icon name="heroCog" size="20" class="text-gray-400 mt-0.5 flex-shrink-0" />
                         <div class="flex-1 min-w-0">
                              <div class="flex items-center gap-2 flex-wrap">
                                   <app-tooltip-link [href]="explorerUrl() + 'account/' + (wallet()?.classicAddress || wallet()?.address || '') + '/tokens'" tooltipText="View Trustlines on XRPL Explorer">
                                        <strong class="text-sm font-semibold text-gray-900 hover:text-blue-600"> {{ tl.currency }} </strong>
                                   </app-tooltip-link>
                              </div>

                              <!-- Metadata -->
                              <div class="mt-3 text-sm">
                                   <app-summary-key-value label="Issuer">
                                        <span class="font-mono text-gray-600 truncate">{{ tl.issuer }}</span>
                                   </app-summary-key-value>

                                   <app-summary-key-value label="Limit">
                                        <strong>{{ tl.limit }}</strong>
                                   </app-summary-key-value>

                                   <app-summary-key-value label="Balance">
                                        <strong>{{ tl.balance }}</strong>
                                   </app-summary-key-value>

                                   @if (tl.flags?.length) {
                                   <app-summary-key-value label="Flags">
                                        <span class="font-medium">{{ tl.flags.join(', ') }}</span>
                                   </app-summary-key-value>
                                   }
                              </div>
                         </div>
                    </div>
               </div>
          </app-summary-item>
          }
     </div>
</app-summary-container>
}
