@let opts = ammUtilsService;

<div class="space-y-6">
     <div class="side-by-side-fields mt-5">
          <div class="space-y-2">
               <div>
                    <div class="field-label">
                         <label for="lpTokenBalance" class="label-primary">LP Token Balance</label>
                    </div>

                    <div class="flex items-center gap-2">
                         <p class="text-secondary">Your current LP token balance in this pool</p>
                         <button type="button" (click)="toggleLpTokenBalanceHelper()" class="text-gray-400 hover:text-gray-600 pb-2">
                              <ng-icon name="heroQuestionMarkCircle" size="14" />
                         </button>
                    </div>
                    <input type="text" readonly class="input-disabled" [value]="ammStoreService.lpTokenBalance() || '0'" />
               </div>
               <app-field-helper title="LP Token Balance" [items]="showLpTokenBalanceHelperItems" [show]="showLpTokenBalanceHelper" />
          </div>
     </div>
     <div class="space-y-3 mt-3">
          <div>
               <label for="depositStrategy" class="mb-1 block text-sm font-semibold text-gray-900">Deposit Strategy</label>
               <p class="text-secondary mb-3">Choose which side(s) of the pool to deposit into.</p>
          </div>

          <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
               <!-- Both Pools (Proportional) -->
               <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="opts.depositOptions().bothPools" [class.bg-green-50]="opts.depositOptions().bothPools">
                    <input type="radio" name="depositStrategy" value="bothPools" [checked]="opts.depositOptions().bothPools" (change)="selectDepositOption('bothPools')" class="hidden" />

                    <div class="mt-0.5 flex-shrink-0">
                         <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="opts.depositOptions().bothPools" [class.border-gray-300]="!opts.depositOptions().bothPools">
                              <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-green-500" [class.scale-100]="opts.depositOptions().bothPools" [class.scale-0]="!opts.depositOptions().bothPools"></div>
                         </div>
                    </div>

                    <div class="flex-1">
                         <div class="flex items-center gap-2">
                              <ng-icon name="heroArrowsRightLeft" size="18" class="text-gray-500 transition-colors group-hover:text-gray-700" [class.text-green-600]="opts.depositOptions().bothPools"></ng-icon>
                              <span class="text-sm font-medium text-gray-900">Both Pools</span>
                         </div>
                         <p class="mt-1 text-xs text-gray-500">Deposit proportionally to both assets</p>
                    </div>
               </label>

               <!-- Asset 1 Only -->
               <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="opts.depositOptions().firstPoolOnly" [class.bg-green-50]="opts.depositOptions().firstPoolOnly">
                    <input type="radio" name="depositStrategy" value="firstPoolOnly" [checked]="opts.depositOptions().firstPoolOnly" (change)="selectDepositOption('firstPoolOnly')" class="hidden" />

                    <div class="mt-0.5 flex-shrink-0">
                         <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="opts.depositOptions().firstPoolOnly" [class.border-gray-300]="!opts.depositOptions().firstPoolOnly">
                              <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-green-500" [class.scale-100]="opts.depositOptions().firstPoolOnly" [class.scale-0]="!opts.depositOptions().firstPoolOnly"></div>
                         </div>
                    </div>

                    <div class="flex-1">
                         <div class="flex items-center gap-2">
                              <ng-icon name="heroBanknotes" size="18" class="text-gray-500 transition-colors group-hover:text-gray-700" [class.text-green-600]="opts.depositOptions().firstPoolOnly"></ng-icon>
                              <span class="text-sm font-medium text-gray-900">Asset 1 Only</span>
                         </div>
                         <p class="mt-1 text-xs text-gray-500">Deposit only the first asset</p>
                    </div>
               </label>

               <!-- Asset 2 Only -->
               <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="opts.depositOptions().secondPoolOnly" [class.bg-green-50]="opts.depositOptions().secondPoolOnly">
                    <input type="radio" name="depositStrategy" value="secondPoolOnly" [checked]="opts.depositOptions().secondPoolOnly" (change)="selectDepositOption('secondPoolOnly')" class="hidden" />

                    <div class="mt-0.5 flex-shrink-0">
                         <div class="flex h-5 w-5 items-center justify-center rounded-full border-2 transition-all duration-200" [class.border-green-500]="opts.depositOptions().secondPoolOnly" [class.border-gray-300]="!opts.depositOptions().secondPoolOnly">
                              <div class="h-2.5 w-2.5 rounded-full transition-transform duration-200 bg-green-500" [class.scale-100]="opts.depositOptions().secondPoolOnly" [class.scale-0]="!opts.depositOptions().secondPoolOnly"></div>
                         </div>
                    </div>

                    <div class="flex-1">
                         <div class="flex items-center gap-2">
                              <ng-icon name="heroBanknotes" size="18" class="text-gray-500 transition-colors group-hover:text-gray-700" [class.text-green-600]="opts.depositOptions().secondPoolOnly"></ng-icon>
                              <span class="text-sm font-medium text-gray-900">Asset 2 Only</span>
                         </div>
                         <p class="mt-1 text-xs text-gray-500">Deposit only the second asset</p>
                    </div>
               </label>
          </div>
     </div>
</div>
