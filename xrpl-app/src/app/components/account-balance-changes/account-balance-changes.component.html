<div class="banner">
     <div class="banner-content">
          <div id="navbar-container">
               <app-navbar></app-navbar>
          </div>
     </div>
</div>

<!-- Main content -->
<div class="main-container">
     <div class="content-wrapper-balance-change">
          <!-- Left: Wallet panel -->
          <app-wallet-panel (walletSelected)="onWalletSelected($event)"></app-wallet-panel>

          <!-- Right: Main panel -->
          <div class="account-changes-form-panel">

               <!-- Page header -->
               <div class="submenu-container">
                    <div class="submenu-info-text" style="margin-bottom: 0">
                         <div class="blue-button-submenu">
                              <ng-icon name="heroChartBar" size="27"></ng-icon>
                         </div>
                         <div>
                              <h2 class="submenu-info-main-text">Account Balance Changes</h2>
                              <p class="submenu-info-secondary-text">View historical XRP balance changes for the selected account</p>
                         </div>
                    </div>
               </div>

               <!-- Info summary (wallet balance + loaded count) -->
               <app-account-changes-summary></app-account-changes-summary>

               <!-- Warning message -->
               @if (txUiService.warningMessage) {
               <app-warning-message [warningMessage]="txUiService.warningMessage"></app-warning-message>
               }

               <!-- Content -->
               @if (walletManager.getSelectedWallet()?.address) {
               <div class="panel-body">
                    <!-- Filters -->
                    <app-account-changes-filters (refresh)="onRefresh()"></app-account-changes-filters>

                    <!-- Loading skeleton for initial load -->
                    @if (store.loadingInitial()) {
                    <div class="initial-loading">
                         <div class="loading-shimmer" *ngFor="let i of [1,2,3,4,5]"></div>
                    </div>
                    } @else {
                    <!-- Table -->
                    <app-account-changes-table (scrolledToBottom)="onLoadMore()"></app-account-changes-table>
                    }
               </div>
               } @else {
               <!-- No wallet selected -->
               <div class="empty-state">
                    <lucide-icon name="wallet" size="48" class="empty-icon"></lucide-icon>
                    <p class="empty-text">Select an account from the wallet panel to view balance changes.</p>
               </div>
               }

          </div>
     </div>
</div>
