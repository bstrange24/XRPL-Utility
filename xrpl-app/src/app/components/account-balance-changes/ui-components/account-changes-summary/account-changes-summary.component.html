@if (viewModel.hasWallets()) { @if (viewModel.infoData(); as info) {
<div class="bg-white-50 border border-gray-200 rounded-2xl p-2 flex gap-4 mb-1">
     <ng-icon name="heroInformationCircle" size="22" class="text-blue-600 mt-2.5 flex-shrink-0" />

     <div class="text-sm leading-relaxed text-grey-800 flex-1">
          <div [innerHTML]="info"></div>
     </div>
</div>
} }
