<div class="card-base">
     <div class="flex flex-col lg:flex-row gap-6">
          <!-- Search -->
          <div class="flex-1">
               <label for="search" class="text-sm font-semibold text-gray-600 block mb-1.5">Search</label>
               <div class="relative">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                         <lucide-icon name="search" size="18" />
                    </div>

                    <input type="text" [ngModel]="store.filterValue()" (ngModelChange)="onSearchInput($event)" placeholder="Hash, type, amount..." class="w-full pl-11 pr-10 py-3 rounded-2xl border border-gray-200 focus:border-green-500 focus:outline-none text-sm bg-white text-gray-900" />

                    @if (store.filterValue()) {
                    <button type="button" (click)="clearFilter()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                         <lucide-icon name="x" size="18" />
                    </button>
                    }
               </div>
          </div>

          <div class="flex-1">
               <label for="dateRange" class="text-sm font-semibold text-gray-600 block mb-1.5"> Date Range </label>

               <div class="relative">
                    <input #rangeInput type="text" readonly placeholder="Select date range..." class="w-full pl-4 pr-10 py-3 rounded-2xl border border-gray-200 focus:border-green-500 focus:outline-none text-sm bg-white text-gray-900 cursor-pointer" />

                    <button type="button" (click)="clearDateFilter()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 transition-colors" matTooltip="Clear date filter">
                         <lucide-icon name="x" size="16" />
                    </button>
               </div>
          </div>
     </div>

     <!-- Action Buttons -->
     <div class="main-button-section">
          <!-- Primary Actions -->
          <div class="flex flex-col gap-3 sm:flex-row">
               <button type="button" class="btn-green" (click)="onRefresh()" [disabled]="store.loadingInitial()">{{ store.loadingInitial() ? 'Loading…' : 'Refresh' }}</button>
          </div>

          <!-- Secondary Actions -->
          <div class="flex items-center justify-end">
               <button type="button" class="btn-secondary" (click)="clearAll()">Clear Filters</button>
          </div>
     </div>
</div>
