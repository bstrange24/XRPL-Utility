<!-- HTML -->
<div class="controls-container">
     <div class="filters-row">
          <!-- Search -->
          <div class="filter-block search-group">
               <label class="filter-label">Search</label>
               <div class="input-row">
                    <div class="search-bar">
                         <mat-icon class="search-icon">search</mat-icon>
                         <input type="text" style="margin-bottom: 0px" [ngModel]="store.filterValue()" (ngModelChange)="onSearchInput($event)" placeholder="Hash, type, amount..." />
                         @if (store.filterValue()) {
                         <button mat-icon-button class="clear-icon" (click)="clearFilter()">
                              <mat-icon>close</mat-icon>
                         </button>
                         }
                    </div>
               </div>
          </div>

          <!-- Date Range -->
          <div class="filter-block date-group">
               <label class="filter-label">Date Range</label>
               <div class="input-row date-row">
                    <input type="date" class="date-input" [ngModel]="store.dateRange().start ? (store.dateRange().start | date:'yyyy-MM-dd') : null" (ngModelChange)="setStartDate($event)" />

                    <span class="range-separator">–</span>

                    <input type="date" class="date-input" [ngModel]="store.dateRange().end ? (store.dateRange().end | date:'yyyy-MM-dd') : null" (ngModelChange)="setEndDate($event)" />

                    <button mat-icon-button (click)="clearDateFilter()" style="margin-bottom: 25px" matTooltip="Clear date filter">
                         <lucide-icon name="eraser" size="12"></lucide-icon>
                    </button>
               </div>
          </div>
     </div>

     <!-- Buttons Row -->
     <div class="button-row">
          <button type="button" class="btn-primary-blue" (click)="onRefresh()" [disabled]="store.loadingInitial()">{{ store.loadingInitial() ? 'Loading…' : 'Refresh' }}</button>

          <button type="button" class="btn-secondary-clear-fields" (click)="clearAll()">Clear Fields</button>
     </div>
</div>
