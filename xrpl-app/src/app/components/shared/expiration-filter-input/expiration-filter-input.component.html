<div class="space-y-1">
     <label class="mb-2 block text-sm font-semibold text-gray-600 pl-2">{{ label() }}</label>

     <div class="relative group">
          <input #flatpickrInput type="text" [ngModel]="value()" (ngModelChange)="onChange($event)" class="w-full border border-gray-200 rounded-2xl pl-11 pr-11 py-3 text-sm focus:outline-none focus:border-blue-500 bg-white cursor-pointer" placeholder="Select date..." readonly />

          <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
               <ng-icon name="heroCalendar" size="18" class="text-gray-400" />
          </div>

          @if (value()) {
          <button (click)="clear(); $event.stopPropagation()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-all">
               <ng-icon name="heroXMark" size="18" />
          </button>
          }
     </div>
</div>
