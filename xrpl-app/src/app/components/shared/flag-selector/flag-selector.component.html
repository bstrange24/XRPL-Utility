<div class="card-base">
     <div class="mb-4 flex items-center gap-2">
          <lucide-icon name="flag" size="18" class="section-heading-icon-green" />
          <span class="text-sm font-semibold text-gray-900">{{ title() }}</span>
     </div>

     <div class="space-y-3">
          @for (flag of flagsConfig(); track flag.key) {
          <label class="group relative flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 transition-all hover:border-gray-300" [class.border-green-500]="isFlagSet(flag.key)" [class.bg-green-50]="isFlagSet(flag.key)">
               <input type="checkbox" [checked]="isFlagSet(flag.key)" (change)="toggleFlag()(flag.key)" class="hidden" />

               <div class="mt-0.5 flex-shrink-0">
                    <div class="flex h-5 w-5 items-center justify-center rounded-md border-2 transition-all duration-200" [class.border-green-500]="isFlagSet(flag.key)" [class.border-gray-300]="!isFlagSet(flag.key)" [class.bg-green-500]="isFlagSet(flag.key)">
                         @if (isFlagSet(flag.key)) {
                         <lucide-icon name="check" size="12" class="text-white transition-transform duration-200" />
                         }
                    </div>
               </div>

               <div class="flex-1">
                    <div class="text-sm font-medium text-gray-900">{{ flag.label }}</div>
                    <div class="mt-0.5 font-mono text-xs text-gray-500">{{ flag.hex }}</div>
                    <div class="mt-0.5 text-xs text-gray-600">{{ flag.description }}</div>
               </div>
          </label>
          }
     </div>

     <div class="mt-5 border-t border-gray-100 pt-4">
          <div class="flex items-center justify-between rounded-xl bg-gray-50 px-3 py-2">
               <span class="text-xs font-medium text-gray-600">Total Flags Value</span>
               <span class="font-mono text-sm font-semibold text-gray-800">
                    {{ totalValue() }}
                    <span class="text-xs text-gray-400">({{ totalHex() }})</span>
               </span>
          </div>
     </div>
</div>
