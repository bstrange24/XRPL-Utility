<!-- Expiration Section -->
<div class="mt-0 max-w-[425px]">
     <div class="space-y-2">
          <label class="text-sm font-medium">{{ label }}</label>

          @if (hint) {
          <p class="text-xs text-gray-500" [innerHTML]="hint"></p>
          }

          <!-- DateTime Input -->
          <input type="datetime-local" [value]="expirationSignal()" step="1" (input)="onInput($event)" class="w-full rounded-2xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-green-500" />

          <!-- Quick Action Buttons - Compact & Colored -->
          <div class="grid grid-cols-3 gap-2 mt-3">
               <button type="button" (click)="setNow()" class="btn-blue text-xs py-2 font-medium">Now</button>
               <button type="button" (click)="addSeconds(10)" class="btn-primary text-xs py-2 font-medium">+10s</button>
               <button type="button" (click)="addSeconds(30)" class="btn-primary text-xs py-2 font-medium">+30s</button>
               <button type="button" (click)="addSeconds(60)" class="btn-primary text-xs py-2 font-medium">+1 min</button>
               <button type="button" (click)="addSeconds(3600)" class="btn-primary text-xs py-2 font-medium">+1 hour</button>
               <button type="button" (click)="clear()" class="btn-red text-xs py-2 font-medium">Clear</button>
          </div>
     </div>
</div>
