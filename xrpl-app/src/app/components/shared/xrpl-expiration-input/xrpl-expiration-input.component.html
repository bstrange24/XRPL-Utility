<div class="form-group">
     <label>{{ label }}</label>

     @if (hint) {
     <p class="form-hint">{{ hint }}</p>
     }

     <div class="expiration-input-group">
          <input type="datetime-local" class="expiration-input" [value]="expirationSignal()" step="1" (input)="onInput($event)" placeholder="Never expires" />
          <div class="expiration-buttons">
               <button type="button" class="btn-small btn-primary-blue" (click)="setNow()">Now</button>
               <button type="button" class="btn-small btn-primary-blue" (click)="addSeconds(10)">+10s</button>
               <button type="button" class="btn-small btn-primary-blue" (click)="addSeconds(30)">+30s</button>
               <button type="button" class="btn-small btn-primary-blue" (click)="addSeconds(60)">+1min</button>
               <button type="button" class="btn-small btn-primary-blue" (click)="addSeconds(3600)">+1h</button>
               <button type="button" class="btn-small btn-primary-red" (click)="clear()">Clear</button>
          </div>
     </div>
</div>
