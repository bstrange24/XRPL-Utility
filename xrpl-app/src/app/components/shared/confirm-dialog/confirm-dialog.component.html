<!-- Custom overlay dialog -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-all">
     <div class="w-full max-w-md transform overflow-hidden rounded-2xl bg-white shadow-2xl transition-all animate-in fade-in zoom-in duration-200">
          <!-- Same content as above -->
          <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-red-50 to-orange-50">
               <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                    <ng-icon name="heroExclamationTriangle" size="20" class="text-red-600" />
                    {{ data.title }}
               </h2>
               <button type="button" (click)="onCancel()" class="rounded-lg p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors">
                    <lucide-icon name="x" size="18"></lucide-icon>
               </button>
          </div>

          <div class="px-6 py-4">
               <div class="summary-item-content">
                    <!-- <div class="flex-shrink-0">
                         <div class="rounded-full bg-red-100 p-2">
                              <ng-icon name="heroExclamationTriangle" size="20" class="text-red-600" />
                         </div>
                    </div> -->
                    <div class="flex-1">
                         <p class="text-sm text-gray-700 leading-relaxed">{{ data.message }}</p>
                    </div>
               </div>
          </div>

          <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
               <button type="button" (click)="onCancel()" class="inline-flex items-center gap-2 rounded-xl border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition-all hover:bg-gray-50 hover:border-gray-400">
                    <ng-icon name="heroXMark" size="16" />
                    Cancel
               </button>
               <button type="button" (click)="onConfirm()" class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-red-600 to-red-700 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-all hover:from-red-700 hover:to-red-800 hover:shadow-md">
                    <ng-icon name="heroTrash" size="16" />
                    Proceed
               </button>
          </div>
     </div>
</div>
