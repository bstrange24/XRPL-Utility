<div class="bg-blue-50 border border-blue-100 rounded-2xl border border-gray-200 bg-white overflow-hidden mb-4">
     <!-- Summary Header -->
     <div class="bg-blue-50 border border-blue-100 p-2 flex items-start justify-between gap-4 border-b border-gray-100">
          <div class="flex items-start gap-3 flex-1 min-w-0">
               <ng-icon name="heroInformationCircle" size="22" class="text-blue-600 mt-0.5 flex-shrink-0" />

               <div class="flex-1 min-w-0">
                    <!-- Always show the smart summary text -->
                    <code class="font-mono text-sm text-gray-700">{{ walletName() }}</code>
                    <span [innerHTML]="summaryText()" class="text-gray-600"></span>
               </div>
          </div>

          <!-- Optional Links -->
          @if (links()) {
          <div class="text-xs text-blue-600 hover:text-blue-700 pt-1 flex-shrink-0" [innerHTML]="links()"></div>
          }

          <!-- Expand/Collapse Button -->
          @if (showExpandButton() && itemCount() > 0) {
          <button type="button" (click)="toggleInfoPanel.emit()" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors whitespace-nowrap flex-shrink-0">
               <span>{{ infoPanelExpanded() ? 'Hide' : 'Show' }} {{ buttonLabel() }}</span>
               <ng-icon name="heroChevronDown" size="18" class="transition-transform" [style.transform]="infoPanelExpanded() ? 'rotate(180deg)' : 'rotate(0deg)'" />
          </button>
          }
     </div>

     <!-- Expandable Items List -->
     @if (itemCount() > 0 && infoPanelExpanded()) {
     <div class="max-h-[420px] overflow-y-auto p-2">
          <ul class="space-y-2">
               <ng-content select="[items-list]" />
          </ul>
     </div>
     }

     <!-- Empty State (only shown when collapsed and no items) -->
     @if (itemCount() === 0 && !infoPanelExpanded() && !loading()) {
     <div class="p-6 text-center">
          <div class="mx-auto w-12 h-8 bg-gray-100 rounded-full flex items-center justify-center mb-3">
               <ng-icon name="heroMagnifyingGlass" size="22" class="text-green-500" />
          </div>
          <p class="text-sm text-gray-500">{{ emptyStateMessage() }}</p>
          @if (emptyStateSubMessage()) {
          <p class="text-xs text-gray-500 mt-1">{{ emptyStateSubMessage() }}</p>
          }
     </div>
     }
</div>
