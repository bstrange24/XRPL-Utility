<div class="space-y-6 p-3">
     <div class="w-full flex items-center justify-between bg-white border border-gray-200 rounded-2xl px-5 py-4 active:bg-gray-100 transition-colors">
          <div class="flex items-center gap-3 flex-1 min-w-0">
               <ng-icon name="heroInformationCircle" size="22" class="text-blue-600 flex-shrink-0" />

               <div class="flex-1 min-w-0 text-left">
                    <code class="text-gray-600">{{ walletName() }}</code>
                    <span [innerHTML]="summaryText()" class="text-gray-600"></span>

                    <!-- Links moved here, under the summary text -->
                    @if (links()) {
                    <div class="mt-2 text-xs text-blue-600 hover:text-blue-700" [innerHTML]="links()"></div>
                    }
               </div>
          </div>

          <!-- Right side: Only expand/collapse button -->
          <div class="flex items-center gap-3 flex-shrink-0">
               @if (showExpandButton() && itemCount() > 0) {
               <!-- <button type="button" (click)="toggleInfoPanel.emit(); $event.stopPropagation()" 
                         class="flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">
                    <lucide-icon [name]="infoPanelExpanded() ? 'chevron-up' : 'chevron-down'" size="16" class="text-gray-500 transition-transform" />
                    <span class="hidden sm:inline">{{ infoPanelExpanded() ? 'Collapse' : 'Expand' }}</span>
               </button> -->
               }
          </div>
     </div>
     <!-- Expandable Content -->
     @if (itemCount() > 0) {
     <!-- <div [@expandCollapse] class="rounded-2xl bg-white overflow-hidden" style="margin-top: 10px"> -->
     <div class="rounded-2xl bg-white overflow-hidden" style="margin-top: 10px">
          <div class="max-h-[750px] overflow-y-auto">
               <ul class="space-y-2">
                    <ng-content select="[items-list]" />
               </ul>
          </div>
     </div>
     }

     <!-- Empty State -->
     @if (itemCount() === 0 && !loading()) {
     <div class="rounded-2xl border border-gray-200 bg-white p-8 text-center">
          <div class="mx-auto w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-3">
               <ng-icon name="heroMagnifyingGlass" size="22" class="text-gray-400" />
          </div>
          <p class="text-sm text-gray-600">{{ emptyStateMessage() }}</p>
          @if (emptyStateSubMessage()) {
          <p class="text-xs text-gray-500 mt-2">{{ emptyStateSubMessage() }}</p>
          }
     </div>
     }
</div>
