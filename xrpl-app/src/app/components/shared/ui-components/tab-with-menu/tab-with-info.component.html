<div class="form-panel-header rounded-t-3xl px-1 py-3">
     <!-- Tabs -->
     @if (tabs().length > 0) {
     <div class="menu-bar bg-white p-1 rounded-2xl mb-2">
          <div class="tab-grid" [class.tab-grid-single]="tabs().length === 1" [class.tab-grid-multiple]="tabs().length > 1">
               @for (tab of tabs(); track tab.key) {
               <button [class]="getButtonClasses(tabs().length, active() === tab.key)" (click)="activeChange.emit(tab.key)" type="button">
                    @if (tab.iconType === 'ng-icon') {
                    <ng-icon [name]="tab.icon" [size]="tabButtonClasses().iconSize" [color]="active() === tab.key ? 'white' : tab.color" class="flex-shrink-0" />
                    } @else if (tab.iconType === 'lucide-icon') {
                    <lucide-icon [name]="tab.icon" [size]="tabButtonClasses().iconSize" [color]="active() === tab.key ? 'white' : tab.color" class="flex-shrink-0" />
                    }
                    <span class="menu-btn-text">{{ tab.label }}</span>
               </button>
               }
          </div>
     </div>
     }

     <!-- Metadata / Submenu Info -->
     @if (currentMeta()) {
     <div class="submenu-info-text flex items-start gap-4">
          <div class="flex-shrink-0 mt-1">
               @if (currentMeta()!.iconType === 'ng-icon') {
               <ng-icon [name]="currentMeta()!.icon" [size]="currentMeta()!.iconSize ?? '24'" [color]="getIconColor()" />
               } @else if (currentMeta()!.iconType === 'lucide-icon') {
               <lucide-icon [name]="currentMeta()!.icon" [size]="currentMeta()!.iconSize ?? '24'" [color]="getIconColor()" />
               }
          </div>
          <div>
               <h2 class="text-2xl font-semibold text-gray-900" style="margin-bottom: 1px">{{ currentMeta()!.title }}</h2>
               <p class="text-gray-600 mt-1 leading-relaxed">{{ currentMeta()!.desc }}</p>
          </div>
     </div>
     }
</div>
