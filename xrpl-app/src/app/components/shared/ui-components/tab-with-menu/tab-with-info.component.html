<div class="form-panel-header border-b border-gray-100 rounded-t-3xl px-2 py-5">
     <!-- Tabs -->
     @if (tabs().length > 0) {
     <div class="menu-bar flex gap-1 bg-gray-100 p-1 rounded-2xl w-fit mb-6">
          @for (tab of tabs(); track tab.key) {
          <button class="menu-btn px-5 py-2.5 rounded-[14px] text-sm font-medium transition-all flex items-center gap-2" [class.active]="active() === tab.key" (click)="activeChange.emit(tab.key)" type="button">
               {{tab.iconType}} @if (tab.iconType === 'ng-icon') {
               <ng-icon [name]="tab.icon" [size]="tab.iconSize ?? '18'" />
               } @else if (tab.iconType === 'lucide-icon') {
               <lucide-icon [name]="tab.icon" [size]="tab.iconSize ?? '18'" />
               } {{ tab.label }}
          </button>
          }
     </div>
     }

     <!-- Metadata / Submenu Info -->
     @if (currentMeta()) {
     <div class="submenu-info-text flex items-start gap-4">
          <div class="flex-shrink-0 mt-1">
               @if (currentMeta()!.iconType === 'ng-icon') {
               <ng-icon [name]="currentMeta()!.icon" [size]="currentMeta()!.iconSize ?? '32'" [color]="currentMeta()!.color" />
               } @else if (currentMeta()!.iconType === 'lucide-icon') {
               <lucide-icon [name]="currentMeta()!.icon" [size]="currentMeta()!.iconSize ?? '32'" />
               }
          </div>
          <div>
               <h2 class="text-2xl font-semibold text-gray-900">{{ currentMeta()!.title }}</h2>
               <p class="text-gray-600 mt-1 leading-relaxed">{{ currentMeta()!.desc }}</p>
          </div>
     </div>
     }
</div>
