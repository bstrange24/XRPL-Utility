<div class="form-panel-header border-white-100 dark:border-gray-700 rounded-t-3xl px-1 py-3">
     <!-- Tabs -->
     @if (tabs().length > 0) {
     <div class="menu-bar flex gap-1 bg-white dark:bg-gray-800 p-1 rounded-2xl w-fit mb-2">
          @for (tab of tabs(); track tab.key) {
          <button class="menu-btn px-4 py-2 rounded-[14px] text-sm font-medium transition-all flex items-center gap-1.5" [class.active]="active() === tab.key" (click)="activeChange.emit(tab.key)" type="button">
               @if (tab.iconType === 'ng-icon') {
               <ng-icon [name]="tab.icon" [size]="tab.iconSize ?? '16'" class="flex-shrink-0" />
               } @else if (tab.iconType === 'lucide-icon') {
               <lucide-icon [name]="tab.icon" [size]="tab.iconSize ?? '16'" class="flex-shrink-0" />
               }
               <span class="menu-btn-text">{{ tab.label }}</span>
          </button>
          }
     </div>
     }

     <!-- Metadata / Submenu Info -->
     @if (currentMeta()) {
     <div class="submenu-info-text flex items-start gap-4">
          <div class="flex-shrink-0 mt-1">
               @if (currentMeta()!.iconType === 'ng-icon') {
               <ng-icon [name]="currentMeta()!.icon" [size]="currentMeta()!.iconSize ?? '24'" [color]="getIconColor()" />
               } @else if (currentMeta()!.iconType === 'lucide-icon') {
               <lucide-icon [name]="currentMeta()!.icon" [size]="currentMeta()!.iconSize ?? '24'" [color]="getIconColor()" />
               }
          </div>
          <div>
               <h2 class="text-2xl font-semibold text-black-900 dark:text-white" style="margin-bottom: 1px">{{ currentMeta()!.title }}</h2>
               <p class="text-black-600 dark:text-gray-400 mt-1 leading-relaxed">{{ currentMeta()!.desc }}</p>
          </div>
     </div>
     }
</div>
