@if (permissionedDomainStoreService.createdPermissionedDomains().length > 0) {
<div class="form-group">
     <label for="selectPDtoDelete">Select Permissioned Domain to delete</label>
     <p class="form-hint">Select an existing permissioned domain attached to the current wallet.</p>
     <app-select-search-dropdown [items]="permissionedDomainViewModelService.domainItems()" [value]="permissionedDomainViewModelService.selectedDomainItem()" (valueChange)="onDomainSelected.emit($event)" placeholder="Search by Domain ID..." emptyMessage="No domains found"> </app-select-search-dropdown>
</div>

<!-- Domain ID Field -->
<div class="form-row">
     <div class="form-group">
          <label for="domainId">Domain ID</label>
          <p class="form-hint">Ledger hash containing the permissioned domain.</p>
          <input type="text" [value]="permissionedDomainStoreService.selectedDomainId()" readonly name="domainId" placeholder="Select a domain above" />
     </div>
</div>
}
