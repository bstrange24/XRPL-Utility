<div class="space-y-6">
     @if (permissionedDomainStoreService.createdPermissionedDomains().length > 0) {

     <!-- Main Card -->
     <div class="rounded-2xl border border-gray-200 bg-white p-5 space-y-6">
          <!-- Domain Selector -->
          <div>
               <label class="block text-sm font-semibold text-gray-700 mb-2"> Select Permissioned Domain to Delete </label>
               <p class="text-sm text-gray-600 mb-3">Select an existing permissioned domain attached to the current wallet.</p>
               <app-select-search-dropdown [items]="permissionedDomainViewModelService.domainItems()" [value]="permissionedDomainViewModelService.selectedDomainItem()" (valueChange)="onDomainSelected.emit($event)" placeholder="Search by Domain ID..." emptyMessage="No domains found"> </app-select-search-dropdown>
          </div>

          <!-- Selected Domain ID -->
          @if (permissionedDomainStoreService.selectedDomainId()) {
          <div>
               <label class="block text-sm font-semibold text-gray-700 mb-2"> Domain ID </label>
               <p class="text-sm text-gray-600 mb-2">Ledger hash of the Permissioned Domain to be deleted.</p>
               <input type="text" [value]="permissionedDomainStoreService.selectedDomainId()" readonly class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm font-mono text-gray-600 cursor-not-allowed" />
          </div>
          }
     </div>

     } @else {

     <!-- Empty State -->
     <!-- <div class="rounded-2xl border border-gray-200 bg-white p-8 text-center">
          <div class="mx-auto w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-4">
               <ng-icon name="heroFolder" size="24" class="text-gray-400" />
          </div>
          <h4 class="font-semibold text-gray-900 mb-1">No Permissioned Domains Found</h4>
          <p class="text-sm text-gray-600">
               This wallet doesn't have any Permissioned Domains to delete.<br />
               Create one first using the "Create / Update" tab.
          </p>
     </div> -->

     }
</div>
