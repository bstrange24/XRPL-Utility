<!-- Get view -->
@let view = permissionedDomainViewModelService;
<!-- Get active tab -->
@let tab = view.activeTab();

<div class="p-1">
     <div>
          <!-- Menu / Tabs -->
          <app-tab-menu-with-info [tabs]="permisisonDoaminTabs" [active]="tab" [metaMap]="tabMeta" (activeChange)="setTab($event)"> </app-tab-menu-with-info>

          <!-- Warning Message -->
          @if (txUiService.warningMessage) {
          <app-warning-message [warningMessage]="safeWarningMessage()"></app-warning-message>
          }

          <!-- Form -->
          <form #theForm="ngForm">
               <!-- Dynamic Form Content -->
               @switch (tab) { @case ('setPermissionedDomain') {
               <app-permission-domain-set-form #setForm [view]="view" [destinationItems]="destinationItems()" [wantsOptions]="txUiService.wantsOptions()" [canSubmit]="canSubmit()" [tab]="tab" (performAction)="performAction()" (clearFields)="clearInputFields()" (toggleOptions)="txUiService.toggleOptions($event)" (canSetPermissionDomainChange)="onCanSetPermissionDomainChange($event)" />

               } @case ('deletePermissionedDomain') {
               <app-permission-domain-delete-form [view]="view" [canSubmit]="canSubmit()" (performAction)="performAction()" (clearFields)="clearInputFields()" (onDomainSelected)="permissionedDomainUtilService.onDomainSelected($event)" />
               } }

               <!-- Transaction Options -->
               <app-transaction-options [showWhenTab]="['setPermissionedDomain', 'deletePermissionedDomain']" [activeTab]="view.activeTab" [multiSigningEnabled]="accountConfiguratorStoreService.multiSigningEnabled()" [regularKeySigningEnabled]="accountConfiguratorStoreService.regularKeySigningEnabled()"> </app-transaction-options>

               <!-- Action Buttons -->
               <div class="main-button-section">
                    <!-- Primary Action -->
                    <app-button-tooltip [tooltipText]="getButtonTooltip()">
                         <button type="button" class="btn-green" [class]="view.infoData()?.actionButtonClass || 'btn-primary'" [class.opacity-50]="!canPerformAction() || !connectionGuard.isConnectionReady()" [attr.aria-disabled]="!canPerformAction() || !connectionGuard.isConnectionReady()" [attr.tabindex]="(!canPerformAction() || !connectionGuard.isConnectionReady()) ? 0 : null" (click)="canPerformAction() && connectionGuard.isConnectionReady() ? performAction() : null" [disabled]="false">
                              {{ view.setPermissionedDomainButtonLabel() }}
                         </button>
                    </app-button-tooltip>

                    <!-- Secondary Button -->
                    <div class="right-buttons">
                         <button type="button" class="btn-secondary" (click)="clearInputFields()" [disabled]="!canSubmit() || !connectionGuard.isConnectionReady()">Clear Fields</button>
                    </div>
               </div>

               <!-- Execution Time -->
               <div class="execution-time">
                    <app-execution-time-display [time]="executionTime()"></app-execution-time-display>
               </div>

               <!-- Transaction Preview -->
               <div class="pt-2">
                    <app-transaction-preview></app-transaction-preview>
               </div>
          </form>
     </div>
</div>
