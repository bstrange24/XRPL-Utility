<!-- checks-summary.component.html -->
@if (checksTransactionViewModelService.infoData(); as info) {
<app-summary-container [walletName]="info?.walletName || ''" [summaryText]="summaryText()" [itemCount]="info?.checkCount || 0" [links]="info?.links || null" [buttonLabel]="'checks'" [emptyStateMessage]="emptyStateMessage()" [infoPanelExpanded]="infoPanelExpanded()" (toggleInfoPanel)="toggleInfoPanel.emit()">
     <!-- Items List -->
     <div items-list>
          @for (check of info?.checksToShow || []; track check.index) {
          <app-summary-item [selected]="check.index === checkUtilService.selectedCheckIndex()" [isExpired]="check.isExpired" [class.border-red-200]="check.isExpired" [copyValue]="check.index.toString()" copyTooltip="Copy Check ID" (onClick)="onCheckClick(check)" (onCopyClick)="copyUtilService.copyAndToast($event, 'Check ID')">
               <div item-content>
                    @switch (check.tab) { @case ('createCheck') {
                    <app-check-create-item [check]="castToCreateCheck(check)" />
                    } @case ('cashCheck') {
                    <app-check-cash-item [check]="castToCashCheck(check)" />
                    } @case ('cancelCheck') {
                    <app-check-cancel-item [check]="castToCancelCheck(check)" />
                    } }
               </div>
          </app-summary-item>
          }
     </div>
</app-summary-container>
}
