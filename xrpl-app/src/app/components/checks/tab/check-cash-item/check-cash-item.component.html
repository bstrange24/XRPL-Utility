<app-tooltip-link [href]="txUiService.explorerUrl() + 'entry/' + check.index" tooltipText="View Check on XRPL Explorer">
     <div class="credential-title-line">
          <span class="check-amount" [class.expired]="check.isExpired"> {{ check.amount }} </span>
          @if (check.isExpired) {
          <span class="expired-badge">Expired</span>
          }
     </div>
</app-tooltip-link>

<div class="credential-meta chips" [class.expired]="check.isExpired">
     <div class="cred-chip">
          <span class="meta-label">Check ID:</span>
          <span class="type">{{ check.index }}</span>
     </div>
     <div class="cred-chip">
          <span class="meta-label">Amount:</span>
          <span class="type">{{ check.amount }}</span>
     </div>
     @if (check.expiration) {
     <div class="cred-chip">
          <span class="meta-label">{{ check.isExpired ? 'Expired:' : 'Expires:' }}</span>
          <span class="type">{{ utilsService.convertXRPLTime(check.expiration) }}</span>
     </div>
     }
</div>
